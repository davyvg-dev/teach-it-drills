<style>

button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;padding:10px 16px;min-height:44px}

.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}

.cstat.due{color:var(--warn);font-weight:600}
.lv{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:.82rem;color:var(--muted)}

.genmsg{font-size:.88rem;color:var(--muted)}
.voice pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0;font-family:var(--body);font-size:.9rem;line-height:1.5}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.how{font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.mono{font-family:var(--display);font-weight:600;letter-spacing:.04em;color:var(--ink);font-variant-numeric:tabular-nums}
h4{font-family:var(--display);font-size:.9rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600;margin:0}
.lesson{gap:12px}
.lpart{display:flex;flex-direction:column;gap:4px}
.lpart p{max-width:62ch}
.remember{font-weight:600;border-left:3px solid var(--accent);padding-left:12px}
.lq{font-family:var(--body);font-size:1.05rem;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);line-height:1.4}
.newnote{font-size:.9rem;color:var(--ink);background:var(--accent-soft);padding:10px 12px;border-radius:8px}

.match{gap:12px}
.rankrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rank-badge{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.lvl{font-family:var(--display);font-size:1.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.pts{font-family:var(--display);font-size:1.1rem;color:var(--muted);font-variant-numeric:tabular-nums}
.identity{font-style:italic;border-left:3px solid var(--ball);padding-left:12px}
.dayswitch{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.seg{border:none;border-radius:0;background:transparent;color:var(--muted);min-height:44px;padding:6px 16px;font-weight:600}
.seg.on{background:var(--accent);color:var(--accent-ink)}
.setline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.setscore{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.setscore.won{color:var(--good)}
.setlabel{font-family:var(--display);font-size:1.1rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
ul.habits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.habit{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:10px 12px}
.habit .tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
.habit.on{border-color:var(--good)}
.habit.on .tick{background:var(--good);border-color:var(--good);color:var(--surface)}
.hlabel{min-width:0}
.hkind{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tempted{background:var(--ball);color:var(--ball-ink);font-family:var(--display);font-size:1.35rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:14px}
.winrow{display:flex;flex-direction:column;gap:6px}
.winrow label{font-size:.9rem;font-weight:600}
.winrow input,#urgechange{flex:1;min-width:0;font:inherit;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#urgechange{width:100%}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.wkd{font-size:.72rem;color:var(--muted)}
.wkr{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--muted)}
.wk.w .wkr{color:var(--good)}
.wk.l .wkr{color:var(--bad)}
.wk.today{border-color:var(--accent)}
.chipbtn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:44px}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.intens{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.intens button{background:var(--bg);border:1px solid var(--line);color:var(--ink);font-family:var(--display);font-size:1.2rem;font-weight:700;padding:6px 0}
.intens button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.clock{font-family:var(--display);font-size:3.4rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.playbox{background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.playbox p{font-weight:600}
.hedit{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
.hedit input,.hedit select,.plan textarea{font:inherit;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.plan textarea{width:100%;min-height:5.5rem;resize:vertical}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.gym .sechead p{max-width:60ch}
details.skilllist>summary{cursor:pointer;font-size:.92rem;color:var(--accent);font-weight:600;min-height:44px;display:flex;align-items:center}
ul.skills{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:6px}

.skillrow{width:100%;display:grid;grid-template-columns:1.8rem 1fr auto;align-items:center;gap:10px;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:8px 12px}
.snum{font-family:var(--display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.sname{min-width:0;font-size:.92rem}
.schip{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.schip.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.schip.mid{color:var(--warn);border-color:var(--warn)}
.numrow{display:flex;align-items:center;gap:8px}
.numrow input{flex:1;min-width:0;font:inherit;font-family:var(--display);font-size:2rem;font-weight:600;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.unit{font-family:var(--display);font-size:1.6rem;font-weight:600;color:var(--muted)}

.btnlink{display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}

details.sync>summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.sync textarea{min-height:5rem;font-size:.85rem}

.drillbar{display:flex;align-items:center;gap:12px}

.pip.done{background:var(--accent)}
.pip.now{background:var(--ink)}
.count{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.chip.lv-apply{background:var(--accent);color:var(--accent-ink)}
.chip.lv-teach{background:var(--good);color:var(--surface)}
.question{font-family:var(--body);font-weight:600;font-size:1.3rem;line-height:1.4;text-wrap:pretty}
.hint{font-size:.9rem;color:var(--muted)}
textarea{width:100%;font:inherit;font-size:1.05rem;line-height:1.5;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical;min-height:9rem}
.err{color:var(--bad);font-size:.92rem}
.quote{border-left:3px solid var(--line);padding-left:12px;color:var(--muted);font-size:.95rem;white-space:pre-wrap;word-break:break-word}
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ball);animation:bounce 1s ease-in-out infinite}

.scoreline{display:flex;align-items:baseline;gap:10px}
.score{font-family:var(--display);font-size:3.4rem;font-weight:700;line-height:.9;min-width:1.2ch;font-variant-numeric:tabular-nums}
.outof{font-family:var(--display);font-size:1.3rem;color:var(--muted)}
.scorelabel{font-family:var(--display);font-size:1.3rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.s0 .score,.s1 .score,.s2 .score{color:var(--bad)}
.s3 .score{color:var(--warn)}
.s4 .score{color:var(--good)}
.s5 .score{color:var(--ball-ink);background:var(--ball);border-radius:8px;padding:2px 10px 0}
.list ul{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.list.good li::marker{color:var(--good)}
.list.miss li::marker{color:var(--bad)}
.model p{margin-top:6px}
.due{font-size:.9rem;color:var(--muted)}
.followq{background:var(--accent-soft);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.followq p{font-weight:600}
.selfgrade{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.selfgrade button{font-family:var(--display);font-size:1.3rem;font-weight:700;padding:8px 0;background:var(--surface);border-color:var(--line);color:var(--ink)}
.biggest{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1}
.biggest span{font-size:1.1rem;color:var(--muted);font-weight:500;margin-left:8px}
ul.sumlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.sumlist li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:start;font-size:.92rem}
.sc{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1;text-align:center}
.sc.s0,.sc.s1,.sc.s2{color:var(--bad)} .sc.s3{color:var(--warn)} .sc.s4{color:var(--good)}

.muted{color:var(--muted)}
@media (max-width:420px){.selfgrade{grid-template-columns:repeat(3,1fr)}h1{font-size:2.2rem}.question{font-size:1.18rem}.cardrow{grid-template-columns:3.6rem 1fr}.cstat{grid-column:2}}
</style>

["L1","leverage","recall","Name the four kinds of leverage. Which two need nobody's permission, and why does that matter for you?",["Labor: other people working for you","Capital: money working for you","Code and media: software and content","Code and media are permissionless and cost almost nothing to copy, so one piece of work can serve millions","He can build both today: software, and content about AI automation or tennis data"]],

["P1","edge","recall","You back a player at 2.50 for ten euros. You think the true chance is 45 percent, and commission is 5 percent on winnings. What probability does the price imply, and what is the expected value of the bet?",["Implied probability is 1 divided by 2.50, so 40%","A win pays €15 profit minus 5% commission, so €14.25","EV = 0.45 × 14.25 − 0.55 × 10, about +€0.91 per bet","Positive because his 45% estimate is above the 40% the price implies"]],

const CARDS2 = /*CARDS2-START*/[{"id":"AI1","topic":"ai","level":"recall","q":"What are tokens and a context window, and why does a long chat with an AI cost far more than its last message suggests?","k":["Models read and write in tokens; in English a token is roughly three quarters of a word","The context window is the most tokens one call can handle: instructions, history, documents and the reply","Models do not remember between calls, so each call resends the whole conversation","You pay for every input and output token, so total cost grows faster than the chat length","Trim or summarise history and send only relevant text"]},{"id":"AI2","topic":"ai","level":"recall","q":"What are the core principles of a good prompt for a business automation, and why do examples and structured output matter so much?","k":["Clear, specific instructions with context: task, audience, goal and limits, like briefing a new colleague","A few examples of input and ideal output show format and tone better than descriptions","Structured output: ask for a fixed format like JSON with named fields, and validate it in code","Say what to do when information is missing, and split complex tasks into steps"]},{"id":"AI3","topic":"ai","level":"recall","q":"What is the difference between retrieval-augmented generation and fine-tuning, and when should you use each for a client project?","k":["RAG searches the client's documents at question time and puts the relevant passages in the prompt","Use RAG for knowledge that changes or must be cited; you update documents, not the model","Fine-tuning trains the model further on examples to change style, format or a narrow repeated task","Fine-tuning is a poor way to add facts; try prompting first, then RAG, then fine-tuning"]},{"id":"AI4","topic":"ai","level":"recall","q":"Why do AI models hallucinate, and what are the main ways to reduce it in a system you build for a client?","k":["Models predict plausible text rather than look facts up, so they can state false things confidently","Ground answers in sources you supply and tell the model to use only those","Give it a way out: let it say it does not know or flag missing information","Ask for quotes or citations and check them in code; use tools for facts and maths","Keep a human review step for high-stakes outputs"]},{"id":"AI5","topic":"ai","level":"apply","q":"Your bot handles two thousand emails a month: four thousand tokens in, five hundred out per email. At a made-up two euros per million in and ten out, find the monthly cost, then cut cost and latency.","k":["Cost per call is input tokens times input price plus output tokens times output price, times volume","Input is 8 million tokens, or 16 euros; output is 1 million tokens, or 10 euros; about 26 euros a month","Cache the fixed part of the prompt and reuse answers to repeat questions","Latency comes mostly from output, so keep replies short, stream them, and use a smaller model for simple steps","Retries, history and agent loops multiply calls, so measure real usage before quoting"]},{"id":"AI6","topic":"ai","level":"apply","q":"You built an AI that sorts a client's emails into five categories. It handled the ten emails you tried. How do you know it is ready to ship, and that it stays good after changes?","k":["Ten examples prove little; build a test set of real, varied emails with correct labels, including hard cases","Grade automatically: exact match for labels, a rubric or model grader for free text, spot-checked by you","Agree a pass bar with the client and study the failures, not just the score","Rerun the eval after every prompt or model change to catch regressions","Add real failures from production to the test set"]},{"id":"AI7","topic":"ai","level":"apply","q":"A physiotherapy practice wants your AI to summarise patient emails and draft replies. What do you check under the GDPR, called the AVG in the Netherlands, before you build it?","k":["The practice is the controller; you and the AI provider are processors, so sign processing agreements","Health data is a special category: it needs a lawful basis, a clear purpose and extra protection","Data minimisation: send only what the task needs and strip identifiers where you can","Check where data is processed, that the provider does not train on it, and how long it is kept","High-risk processing calls for a data protection impact assessment, a DPIA"]},{"id":"AI8","topic":"ai","level":"teach","q":"Teach me how tool use and the agent loop work, and where a human should stay in the loop.","k":["Tools are functions you describe to the model by name, purpose and inputs","The model does not run tools: it asks for a call, your code runs it and returns the result","The agent loop: decide, call a tool, read the result, repeat until done or a step limit is hit","Grant only the permissions the task needs, and cap steps and spend","A human approves irreversible or external actions, like sending, paying or deleting"]},{"id":"HE1","topic":"health","level":"recall","q":"What are the basics of good sleep for an adult: how many hours, what schedule, and what light? Why do sleep experts anchor the wake time first?","k":["Most adults need about 7 to 9 hours a night","Keep the same wake time every day, weekends included","A fixed wake time anchors the body clock, and sleepiness then sets the bedtime","Get bright daylight soon after waking, ideally outdoors","Morning light shifts the clock earlier; bright light late at night shifts it later"]},{"id":"HE2","topic":"health","level":"recall","q":"How do caffeine and alcohol affect sleep? Give caffeine's rough half-life, and explain why a nightcap is a poor sleep aid.","k":["Caffeine blocks adenosine, the chemical that builds sleep pressure, so it masks tiredness","Its half-life is roughly 5 hours on average, and it varies widely between people","Stop caffeine many hours before bed; about 8 hours is a common rule of thumb","Alcohol helps you fall asleep faster but fragments the second half of the night and cuts REM sleep"]},{"id":"HE3","topic":"health","level":"recall","q":"How much strength training do health guidelines recommend each week, what principle drives progress, and why does it matter beyond looks?","k":["At least two days a week, working all major muscle groups, per WHO guidelines","Progressive overload: gradually add weight or reps over time","Heavy and lighter loads both build muscle if sets end close to failure","Benefits: keeps muscle and bone as you age, improves blood sugar control, and is linked with lower risk of death"]},{"id":"HE4","topic":"health","level":"recall","q":"What does research say about daily step counts, where does the ten thousand steps target come from, and how should you break up a long day of sitting?","k":["More steps are linked with lower risk of death, with the biggest gains when going from very few to moderate","For adults under 60, the benefit levels off around 8,000 to 10,000 steps a day","Ten thousand steps began as a marketing slogan for a Japanese pedometer, not a scientific threshold","Short walking breaks during long sitting, and a walk after meals, lower the rise in blood sugar"]},{"id":"HE5","topic":"health","level":"apply","q":"You weigh 80 kilograms and lift twice a week to build muscle. Work out your daily protein target, and explain how you would spread it over the day.","k":["About 1.6 grams per kilogram of body weight per day, from the Morton 2018 meta-analysis","80 times 1.6 is about 128 grams a day","Spread over 3 or 4 meals of roughly 30 to 40 grams; the daily total matters most","Above about 1.6, extra protein adds little muscle for most people; training is the main driver"]},{"id":"HE6","topic":"health","level":"apply","q":"You land after a delayed flight with fifteen minutes before a pitch call to a big new client. Your heart is pounding and your thoughts race. What do you do, and why does it work?","k":["Slow breathing, around six breaths a minute","Make the exhale longer than the inhale, because breathing out slows the heart","Slow breathing shifts the nervous system toward its calming, rest and digest side","Optional: a physiological sigh, two inhales through the nose then one long exhale","A few minutes lowers arousal; it takes the edge off nerves rather than removing them"]},{"id":"HE7","topic":"health","level":"apply","q":"Tomorrow you have a hard coding task, three client calls, some admin, and an evening match to trade. How do you arrange the day around your energy?","k":["Put the hardest thinking in your peak alertness window, usually a few hours after waking","Use the early afternoon dip for calls, admin or a short walk","A nap of 10 to 20 minutes restores alertness; much longer naps can leave you groggy","Stop caffeine by early afternoon and keep your normal wake time after the late match","Chronotypes differ, so track your own energy for a week"]},{"id":"HE8","topic":"health","level":"teach","q":"Teach me why aerobic fitness, measured as VO2 max, is one of the strongest predictors of how long people live, and how a busy founder can improve it.","k":["VO2 max is the most oxygen your body can take in and use during all-out effort","In large observational studies, low fitness predicts early death as strongly as smoking or diabetes; it is a link, not proof","The biggest gain comes from leaving the least fit group","Aim for 150 to 300 minutes of moderate or 75 to 150 minutes of vigorous activity a week","Train mostly at an easy, talking pace, plus some hard intervals"]},{"id":"MI1","topic":"mindset","level":"recall","q":"What did Gabriele Oettingen find about positive fantasies of the future, and how does mental contrasting, also called WOOP, fix the problem?","k":["Positive fantasies alone predicted less effort and worse results, such as less weight lost and fewer job offers","The fantasy feels like arriving, so the energy to act drops","Positive expectations based on past experience are different and do predict success","WOOP: wish, outcome, obstacle, plan, with the obstacle found inside yourself","Contrasting builds commitment when the goal is feasible and helps you let go when it is not"]},{"id":"MI2","topic":"mindset","level":"recall","q":"What is an implementation intention, who studied it, and why does an if-then plan work better than simply intending to do something?","k":["A plan in the form: if this situation happens, then I will do this","Peter Gollwitzer, from the 1990s","The cue triggers the action, so you do not have to decide again in the moment","A 2006 meta-analysis of nearly a hundred studies found a medium to large effect","Works for obstacles too, and the cue must be specific"]},{"id":"MI3","topic":"mindset","level":"recall","q":"According to Locke and Latham's goal-setting theory, what makes a goal work, and when can hard goals backfire?","k":["Specific, hard goals beat easy goals and vague do your best goals","They need feedback on progress and real commitment","They work by focusing attention, raising effort and persistence, and pushing better strategies","For complex new skills, learning goals often beat outcome goals","Hard outcome goals can push risky or dishonest shortcuts, so trading goals should target process"]},{"id":"MI4","topic":"mindset","level":"recall","q":"Why does something you just learned about suddenly seem to be everywhere? Explain selective attention, the invisible gorilla study, and what is wrong with the reticular activating system story.","k":["Attention is limited, so the brain filters for what fits your current goals","Simons and Chabris, 1999: about half the viewers counting basketball passes missed a person in a gorilla suit","Looking for something makes you notice it more, not happen more","The reticular activating system is a real brainstem network mainly for arousal and wakefulness; programming it with goals is a pop simplification","The same filter hides what you are not looking for, so also look for evidence against you"]},{"id":"MI5","topic":"mindset","level":"apply","q":"Before a big pitch to a forty thousand euro client, you plan to picture yourself signing the deal every morning. Based on Taylor and Pham's research, what should you visualise instead?","k":["Outcome visualisation pictures the result; process visualisation pictures the steps","Students who pictured where, when and how they would study, studied more and got better grades than those who pictured the grade","Process visualisation also improved planning and lowered anxiety","Here: rehearse your preparation, your opening, the hardest objections and your answers"]},{"id":"MI6","topic":"mindset","level":"apply","q":"You want to post weekly videos about AI automation, but you freeze on camera and doubt you can do it. Using Bandura's self-efficacy and James Clear's identity idea, how do you build real confidence?","k":["Self-efficacy, from Albert Bandura: belief that you can do a specific task","Mastery experiences are its strongest source; others are seeing peers succeed, encouragement, and how you read your nerves","Start with tiny wins: a private clip, then one for a friend, then a public video","Clear's popular framework: each action is a vote for who you are becoming","Act before you feel confident; confidence follows the wins"]},{"id":"MI7","topic":"mindset","level":"apply","q":"Your first paid ad campaign for the dropshipping store loses money, and you think, I am just not good at marketing. How does growth mindset research apply, told honestly?","k":["Dweck: a fixed mindset sees ability as set, a growth mindset sees it as something you develop","Later large replications and meta-analyses found much smaller effects than first claimed","Effects showed up mainly for struggling students, and their size is still debated","Belief alone is not enough: change strategy, get feedback and practise","Reframe as not good at marketing yet, then plan specific tests"]},{"id":"MI8","topic":"mindset","level":"teach","q":"Teach me why the law of attraction, as literally claimed, has no evidence, why it still seems to work for people, and what actually turns wanting into getting.","k":["The claim: thoughts send out a signal that draws matching events; no known mechanism and no controlled evidence","It seems to work through selective attention, confirmation bias and survivorship bias","Picturing only the outcome can backfire: Oettingen found fantasies alone lower effort","What works: specific goals, WOOP, if-then plans and process visualisation, then action","Keep the useful core: clarity about what you want and belief that you can act"]},{"id":"MO1","topic":"money","level":"recall","q":"Why should an entrepreneur keep an emergency fund, how big should it be, and what does paying yourself first mean in practice?","k":["An emergency fund is cash for shocks like a lost client or a big repair, so you never sell investments or borrow in a crisis","Rule of thumb: three to six months of essential costs, more when income is irregular","Keep it in a separate, easy-access savings account, not in stocks or a betting bank","Pay yourself first: on payday, automatically move savings out before you spend","Entrepreneurs also move their tax reserve into its own account"]},{"id":"MO2","topic":"money","level":"recall","q":"What is the difference between a nominal and a real return? If your savings earn one and a half percent and inflation is three percent, what really happens to your money?","k":["Inflation is the general rise in prices, so each euro buys less","Real return is roughly the nominal return minus inflation","One and a half minus three is about minus one and a half percent a year, so you lose buying power","Cash feels safe but loses value when its interest trails inflation; long-term money must beat inflation after costs and tax"]},{"id":"MO3","topic":"money","level":"recall","q":"Explain diversification, the link between risk and return, and how your time horizon should shape how much you hold in stocks versus cash.","k":["Higher expected return comes with bigger swings in value, which is the risk you are paid to carry","Diversification spreads money over many assets so one failure cannot sink you, cutting risk without giving up much return","It cannot remove market-wide risk: in a crash most stocks fall together","Money needed within a few years belongs in cash or similar; money for ten years or more can sit mostly in stocks","Concentration, like your own business, builds wealth; diversification protects it"]},{"id":"MO4","topic":"money","level":"recall","q":"What separates good debt from bad debt? Show what a twenty thousand euro car loan at eight percent over five years really costs.","k":["Good debt funds something likely to earn more than the interest, like equipment with a clear payback","Bad debt funds consumption that loses value, especially at high rates","The car loan costs about 405 euros a month, about 24,330 euros in total, so about 4,330 euros of interest","Paying off debt is a guaranteed return equal to its interest rate","Debt magnifies losses, so never borrow to bet or to buy risky assets"]},{"id":"MO5","topic":"money","level":"apply","q":"A bank fund charges one and a half percent a year, an index fund zero point two percent. Assume seven percent returns before costs. What happens to fifty thousand euros over thirty years in each?","k":["Index funds track a whole market at very low cost, and most active funds trail their index after fees over long periods","Fees are taken every year from the whole balance, so they compound against you","Net returns of about 6.8 versus 5.5 percent give roughly 360,000 versus 249,000 euros after 30 years","The fee gap costs about 110,000 euros, almost a third of the index result"]},{"id":"MO6","topic":"money","level":"apply","q":"A new retainer lifts your take-home pay from four thousand to six thousand euros a month, and you're eyeing a nicer car and apartment. How do you avoid lifestyle creep? Use numbers.","k":["Lifestyle creep: spending rises with income, so savings never grow","Hedonic adaptation: upgrades soon feel normal, but the costs stay","If spending eats the raise, saving stays at 1,000 and the rate falls from 25 to about 17 percent; saving half the raise means 2,000, about 33 percent","Fixed costs are sticky and raise both the buffer and the wealth you need to be free","Decide the split before the money arrives and automate it"]},{"id":"MO7","topic":"money","level":"apply","q":"Your betting bank has grown from five hundred to fifteen hundred euros. Your car needs a repair, and later you may want to top the bank up from savings. What rules should govern money moving between them?","k":["Keep the bank in its own account, apart from personal and business money","Fund it only with money you can afford to lose completely","Never top up from life money after losses; reload only under a rule set in advance","Withdraw profits by a fixed rule, such as anything above a set level, and size stakes from what remains","Track the bank like a business, with its own records"]},{"id":"MO8","topic":"money","level":"teach","q":"Teach me the Dutch box system for an entrepreneur, and when a BV or a holding starts to beat a sole proprietorship, an eenmanszaak.","k":["Box 1 taxes income from work, including eenmanszaak profit, at rates that rise with income","Box 2 taxes dividends and sale gains from a substantial stake in a company, such as your own BV","Box 3 taxes savings and investments on a return linked to your wealth, under rules being reformed","A BV pays corporate tax on profit; you pay box 1 on your salary and box 2 only when profit comes out","An eenmanszaak is simpler at lower profit; a BV or holding pays off as profit grows; rates change yearly, so check with an accountant"]},{"id":"OF1","topic":"offers","level":"recall","q":"Explain Alex Hormozi's value equation. What are its four parts, and how can you make an offer more valuable without lowering the price?","k":["Value equals dream outcome times perceived likelihood of achievement, divided by time delay times effort and sacrifice","It is a practical framework from his book, not a research finding","Raise the top: a clearer, bigger outcome and more proof that it will work","Shrink the bottom: faster results and less work for the buyer, such as done-for-you","Either way, value rises while the price stays the same"]},{"id":"OF2","topic":"offers","level":"recall","q":"Why offer three pricing tiers instead of one price? Explain how anchoring and the decoy effect can steer buyers toward the option you want.","k":["Tiers change the question from whether to buy into which option, and let bigger budgets pay more","Anchoring: the first or highest price people see sets their reference point, so a high top tier makes the middle look reasonable","Decoy effect: an option clearly worse than your target, but close to it, makes the target look like the smart choice","The decoy effect is real but often modest, so every tier must still be a genuine option"]},{"id":"OF3","topic":"offers","level":"recall","q":"What is the problem, agitate, solve formula in copywriting, and why do specific benefits persuade better than vague claims?","k":["Problem: name the reader's problem in their own words","Agitate: show what leaving it unsolved costs them, honestly","Solve: present your offer as the way out, with one clear call to action","Write benefits, what changes for the reader, rather than features","Specific claims like six hours saved a week are more believable and easier to picture than vague ones like saves time"]},{"id":"OF4","topic":"offers","level":"recall","q":"What makes a case study or testimonial actually persuasive, and how should you structure one for your agency?","k":["Proof from similar clients persuades most, because buyers identify with businesses like their own","Structure: the situation before, what you did, and the measurable result with a time frame","Specific numbers and a real name and business make it believable","The client's own words, ideally naming the doubt they had before buying","Place proof where the buyer hesitates, such as next to the price or call to action"]},{"id":"OF5","topic":"offers","level":"apply","q":"You sell a lead follow-up system to gyms for nine hundred euros a month, and prospects worry it won't work. Design a guarantee and check whether you can afford it.","k":["Risk reversal moves the risk from buyer to seller, raising perceived likelihood and making yes easier","Tie it to a specific, measurable result you largely control, within a time frame","Set clear conditions the client must meet, like replying to booked leads quickly","Check the maths: the extra clients won must outweigh the refunds paid","Don't guarantee outcomes outside your control, like total revenue"]},{"id":"OF6","topic":"offers","level":"apply","q":"Your store spends one thousand euros on ads for two thousand visitors, and two percent buy. Each order makes twenty euros gross profit, and customers order twice on average. Is that healthy?","k":["2 percent of 2,000 visitors is 40 customers, so CAC is 1,000 divided by 40, which is 25 euros","LTV in gross profit is 2 orders times 20, which is 40 euros","LTV to CAC is 40 to 25, about 1.6, below the rule of thumb of about 3","The first order loses 5 euros, so each customer only pays off on the repeat order","Levers: raise conversion, profit per order or repeat purchases, or cut traffic cost"]},{"id":"OF7","topic":"offers","level":"apply","q":"You want more inbound leads from Dutch accounting firms for your automation agency. Design a lead magnet, and explain how you'd know whether it's working.","k":["Solve one narrow, urgent problem for that specific niche","Quick to use with a quick win, like a checklist, template or short audit","Leads naturally to your paid offer by revealing the bigger problem you solve","One clear next step, like booking a short call, in exchange for an email address","Judge it on calls booked and clients won, not just downloads"]},{"id":"OF8","topic":"offers","level":"teach","q":"Teach me why picking a narrow niche usually helps an agency grow, even though it means saying no to some clients.","k":["Positioning is the distinct place you hold in buyers' minds compared with the alternatives","A niche is a specific type of client with a specific problem","Specialists are easier to find, trust and refer, and can usually charge more","Repeating similar projects lets you reuse work, so delivery gets faster and margins rise","The niche shapes your marketing, but you can still take good work outside it"]},{"id":"PE1","topic":"people","level":"recall","q":"What is active listening, and what are the main moves of reflecting back? Why does it help in a tense conversation with a client?","k":["Full attention, aiming to understand before you reply; the idea comes from psychologist Carl Rogers","Paraphrase the content in your own words","Name the feeling you hear, such as frustration","Summarise and check: did I get that right?","Feeling understood lowers tension and makes people share more, so you get better information"]},{"id":"PE2","topic":"people","level":"recall","q":"Explain the situation, behaviour, impact framework for giving feedback. Why does it work better than telling someone they did a bad job?","k":["A feedback framework from the Center for Creative Leadership","Situation: the specific when and where","Behaviour: what the person actually did or said, observable rather than a judgement","Impact: the effect it had on you, the client or the project","Then ask for their view and agree next steps"]},{"id":"PE3","topic":"people","level":"recall","q":"Name four of Dale Carnegie's principles for getting people to like and trust you. Why does talking in terms of the other person's interests work so well?","k":["Remember people's names and use them","Talk in terms of the other person's interests","Be genuinely interested and get them talking about themselves","Give honest, sincere appreciation, and don't criticise, condemn or complain","They come from a 1936 book; practical principles that only work if sincere"]},{"id":"PE4","topic":"people","level":"recall","q":"What does bottom line up front mean in writing, and how would you structure an email asking a client to approve a delayed launch?","k":["Put the main point or request in the first line or two","Then give the key reasons, most important first, then the details","Make the ask explicit, with a deadline","It comes from military writing; Barbara Minto's pyramid principle teaches the same answer-first idea","Busy readers skim, so the opening must stand alone"]},{"id":"PE5","topic":"people","level":"apply","q":"A dentist tells you on a first call: we want an AI chatbot. What questions do you ask before quoting, and why open questions rather than yes or no ones?","k":["Open questions start with what, how or tell me about, and can't be answered with yes or no","Ask about the current process and the problem, not the solution they named","Put a number on the cost of the problem: hours, missed bookings, money","Ask what success looks like and who decides","Use closed questions at the end only to confirm facts"]},{"id":"PE6","topic":"people","level":"apply","q":"A client tells you on a call that your agency is slow and the last automation broke twice. You feel defensive. How do you respond in the moment and afterwards?","k":["Pause and don't defend or explain straight away","Ask for specifics: what broke, when, and what it cost them","Separate the feedback from your identity and look for what is true, even if only partly","Thank them, summarise what you heard, and say what will change and by when","Follow up afterwards with the fix and check it worked"]},{"id":"PE7","topic":"people","level":"apply","q":"A good client asks for a quick extra feature, for free, in a week you are fully booked. How do you say no without harming the relationship?","k":["Answer quickly and clearly; a vague maybe costs more later","William Ury's positive no: a yes to your priorities, then a clear no, then a yes to an alternative","Offer an alternative, such as a paid change request or a later date","Keep reasons short, without long excuses or apologies","Every yes is a no to something else, such as other clients' deadlines"]},{"id":"PE8","topic":"people","level":"teach","q":"Teach me the situation, complication, resolution structure, and how to use it to make a pitch or a short talk memorable.","k":["Situation: familiar context the audience already accepts","Complication: the problem or change that creates tension","Resolution: your answer, built around one core message","A consulting framework popularised by Barbara Minto; tension holds attention better than a list of facts","Support it with about three points and rehearse it out loud"]},{"id":"SA1","topic":"sales","level":"recall","q":"What are the four question types in Neil Rackham's SPIN model, and which ones did his research link most strongly to success in larger sales?","k":["Situation questions gather facts about the buyer's setup; sellers overuse them and buyers find too many boring","Problem questions uncover difficulties and dissatisfaction","Implication questions explore what the problem costs and causes, so it feels bigger and more urgent","Need-payoff questions get the buyer to state the value of a fix in their own words","In larger sales, implication and need-payoff questions were most linked to success"]},{"id":"SA2","topic":"sales","level":"recall","q":"What does it mean to qualify a lead, what four things does the BANT framework check, and why is disqualifying early good for your agency?","k":["Qualifying means checking early whether a lead can and will buy, before you invest sales time","BANT is a framework: budget, authority, need and timeline","Ask these as natural questions in conversation, not as an interrogation","Disqualifying early is a win: a fast no frees time for buyers who can say yes"]},{"id":"SA3","topic":"sales","level":"recall","q":"Name Cialdini's seven principles of influence, and explain why they only work in the long run when the signals you use are true.","k":["Reciprocity: people want to return a favour; commitment and consistency: people act in line with what they've already said","Social proof: people follow similar others; liking: people say yes to those they like","Authority: people trust credible experts; scarcity: people want what is rare or running out","Unity: people favour those who share their identity, added in his later work","Fake scarcity or invented proof gets found out and destroys the trust every other principle needs"]},{"id":"SA4","topic":"sales","level":"recall","q":"What is the difference between an advance and a continuation at the end of a sales call, and how should you ask for the next step?","k":["Advance: the buyer commits to a specific action that moves the deal forward, like a meeting with the decision-maker","Continuation: a friendly ending with no concrete commitment, like send me something","Rackham found pressure closing techniques tended to hurt in larger sales","Plan the best realistic advance before the call, then ask for it directly with a date and time","Book it in the calendar before the call ends"]},{"id":"SA5","topic":"sales","level":"apply","q":"You want two new clients a month. A third of your proposals close, half your sales calls lead to a proposal, and two percent of cold emails book a call. How many emails do you need?","k":["Work backwards from the goal, dividing by each stage's conversion rate","2 clients divided by one third is 6 proposals","6 proposals divided by one half is 12 sales calls","12 calls divided by 2 percent is 600 emails a month, about 30 per working day","Doubling any single conversion rate halves the emails needed, so improve rates, not just volume"]},{"id":"SA6","topic":"sales","level":"apply","q":"A gym owner tells you: we tried an automation agency last year and it was a waste of money. How do you handle that objection?","k":["Acknowledge the concern calmly instead of arguing or defending","Ask questions to find out exactly what went wrong last time","Answer that specific concern with proof, such as a similar client or a concrete difference in how you work","Lower the risk with a small first step, like a short paid pilot with an agreed success measure","Check the concern is resolved, then agree a concrete next step"]},{"id":"SA7","topic":"sales","level":"apply","q":"You want to win Dutch estate agents as clients with an AI assistant that answers enquiries after hours. How do you write a cold email that gets replies, and how do you follow up?","k":["Send to a tight list of good-fit prospects, not a mass blast","Open with a specific, genuine reason you're writing to them, based on their business","Name one problem and one outcome in a few short sentences, about them, not you","End with a low-effort ask, like whether it's worth a short look, not a long meeting","Follow up a few times, spaced out, each adding something new, then stop politely"]},{"id":"SA8","topic":"sales","level":"teach","q":"Teach me why selling outcomes and return on investment beats selling hours, and how to build a simple return on investment case for a client.","k":["Clients buy a result, like more booked jobs or saved time, not your hours","Quantify the value with the client's own numbers, gathered in discovery","Show the payback period: your price divided by the monthly gain","Next to the value, the price gets compared with the result instead of your hourly rate","Hourly pricing punishes you for getting faster, for example with AI tools"]},{"id":"SM1","topic":"self","level":"recall","q":"What is urge surfing, where does it come from, and how do you actually do it when a strong urge hits?","k":["From Alan Marlatt's relapse prevention work, later built into mindfulness-based relapse prevention by Sarah Bowen","Urges rise, peak and fade like a wave, as long as you do not act on them","Notice the body sensations: where you feel the urge and how it changes","Breathe slowly and label it: this is an urge, and it will pass"]},{"id":"SM2","topic":"self","level":"apply","q":"You promised yourself no phone in bed this week. On Tuesday you scroll until one in the morning. The next day you think the week is ruined anyway. What is happening, and what do you do?","k":["The abstinence violation effect, from Marlatt and Gordon's relapse prevention model","One slip triggers the thought I have blown it, so why stop, which turns a lapse into a relapse","A lapse is a single slip; a relapse is sliding back into the old pattern","Treat the slip as data: what led to it, and what you change tonight","Never miss twice: get back on plan at the very next chance"]},{"id":"SM3","topic":"self","level":"recall","q":"Why do people with strong self-control rely less on willpower than you might think, and what happened to the idea that willpower is a fuel tank?","k":["In Hofmann and colleagues' experience sampling study, people high in self-control reported fewer temptations and resisted less often","They mostly avoid temptations through their situation instead of fighting them in the moment","Duckworth and colleagues: changing your situation works earlier and more reliably than willpower in the moment","Add friction to temptations and remove friction from good habits","Ego depletion, the fuel tank idea, failed large replications across many labs"]},{"id":"SM4","topic":"self","level":"recall","q":"What are self-handicapping and self-verification, who studied them, and how can each lead you to sabotage your own success?","k":["Self-handicapping, from Berglas and Jones: you hold back effort or create an obstacle before a test of your ability","A failure can then be blamed on the obstacle, which protects your self-image, but over time it is linked to worse results","Self-verification, from William Swann: people seek feedback that confirms how they already see themselves","This holds even for a negative self-view, so success that does not fit your self-image can get pushed away"]},{"id":"SM5","topic":"self","level":"apply","q":"After a bad trading day where you broke your own rules, you spend the evening calling yourself an idiot. What does research on self-compassion suggest you do instead, and why?","k":["Breines and Chen, 2012: self-compassion after a failure increased motivation to improve","In one study, students who were kind to themselves after failing a test studied longer for the retest","Neff's three parts: kindness to yourself, remembering that everyone fails, and noticing the pain without drowning in it","It is not letting yourself off the hook: you still own the mistake and set one concrete fix"]},{"id":"SM6","topic":"self","level":"apply","q":"It is late, you skipped dinner after a stressful day, and you are alone on the sofa with your phone. You feel the pull of a habit you want to break. How does HALT help, tonight and afterwards?","k":["HALT means hungry, angry, lonely, tired: a practical check from recovery programs, not a research finding","Here several triggers stack up, plus being alone with a phone late at night, so treat the urge as a signal","Meet the real need: eat, put the phone in another room, go to bed or call someone","Log the trigger: time, place, feeling and what happened just before","Use the log as a map to redesign your environment"]},{"id":"SM7","topic":"self","level":"recall","q":"What is Daryl Bem's self-perception theory, and how can small kept promises and a daily win log rebuild a weak self-image?","k":["Daryl Bem: people infer who they are by watching their own behaviour, as an outsider would","This is strongest when your inner sense of yourself is weak or unclear","Small promises you keep are evidence that you follow through","Keep promises small, because broken promises are evidence too","A daily win log makes the evidence visible, so your self-image updates from facts"]},{"id":"SM8","topic":"self","level":"teach","q":"Teach me how to manage sexual urges without falling into the shame cycle.","k":["Sexual desire is normal and healthy; the goal is acting in line with your own values","Grubbs and colleagues: feeling addicted to pornography is strongly linked to moral disapproval and shame, not only to how much you watch","Shame and secrecy can feed the cycle: slip, shame, hiding, stress, urge","Tools: phone out of the bedroom, urge surfing, the HALT check, a replacement action and accountability","After a lapse use self-compassion, and if it feels out of control, see a therapist trained in CBT"]},{"id":"WI1","topic":"wisdom","level":"recall","q":"What is the Stoic dichotomy of control as Epictetus taught it, and how should it change the way you judge a trading day?","k":["Up to us: our judgments, choices and actions","Not fully up to us: outcomes, other people, reputation and markets","Put effort into what you control and accept the rest calmly","We are upset less by events than by our judgments about them","Judge a trading day on process: following the model, staking and execution, not profit"]},{"id":"WI2","topic":"wisdom","level":"recall","q":"Who coined the phrase the map is not the territory, what does it mean, and why does it matter when you trust a backtest?","k":["Alfred Korzybski, in the 1930s","A model of reality is not reality itself","Every map leaves things out, which makes it useful but also risky","A backtest is a map: live markets add delays, thin liquidity and faster traders","When reality disagrees, update the model instead of defending it"]},{"id":"WI3","topic":"wisdom","level":"apply","q":"A webshop client wants an automation that emails a discount code to everyone who abandons a cart. Use second-order thinking to judge the idea.","k":["First-order effect: more carts recovered and a short-term sales bump","Keep asking and then what, over time and for each group affected","Second-order risk: customers learn to abandon carts to get a code, so full-price sales and margins fall","Better design: a plain reminder first, codes limited per customer, tested against a control group","Howard Marks calls this second-level thinking"]},{"id":"WI4","topic":"wisdom","level":"recall","q":"What is via negativa, and why does Nassim Taleb argue that removing things often works better than adding them?","k":["Improving by subtraction: remove what harms instead of adding what might help","Taleb, in Antifragile: we know more reliably what hurts than what helps","Adding brings side effects you cannot foresee; removing a known harm usually does not","People overlook subtraction by default, as a 2021 Nature study by Adams and colleagues found","Examples: drop a draining client, cut weak model filters, remove unused features"]},{"id":"WI5","topic":"wisdom","level":"apply","q":"Your tennis system works, and a friend says you should use the same approach on in-play football and horse racing. How does the circle of competence guide you?","k":["Circle of competence, from Buffett and Munger: the areas you truly understand","Knowing its boundary matters more than its size","Tennis skill does not transfer automatically: different data, market structure and opponents","Test: can you explain why you would win, and who is losing to you?","Expand on purpose: research, paper trading, then tiny stakes"]},{"id":"WI6","topic":"wisdom","level":"apply","q":"You take over a client's automation and find a strange step that delays every order email by ten minutes. You want to delete it. What does Chesterton's fence tell you to do?","k":["Do not remove something until you know why it was put there","From the writer G. K. Chesterton, 1929","Find the reason: ask the client, read the change history, check the logs, test in a copy","If the reason is gone or no longer worth it, remove it in a way you can undo","It is not a rule against change, only against change without understanding"]},{"id":"WI7","topic":"wisdom","level":"recall","q":"What is hedonic adaptation, and what does it mean for your goal of building multi-million wealth?","k":["People adapt to most changes, good or bad, and drift back toward their usual happiness","Brickman and Campbell called it the hedonic treadmill","Adaptation is often incomplete, and money helps on average, but each extra euro adds less","Aim wealth at freedom and security, and spend on time, experiences and other people","Enjoy the process, because no milestone will make you permanently happier"]},{"id":"WI8","topic":"wisdom","level":"teach","q":"Teach me inversion: where the idea comes from, how Charlie Munger used it, and how to run it on a real goal.","k":["Flip the question: ask what would guarantee failure, then avoid those things","From the mathematician Carl Jacobi: invert, always invert","Munger: tell me where I am going to die, so I will never go there","Avoiding stupidity is often easier and more reliable than seeking brilliance","A worked example: list how the goal would fail, then turn each item into a rule"]}]/*CARDS2-END*/;
const CARDS = RAW.map(r=>({id:r[0], t:r[1], lv:r[2], q:r[3], k:r[4]}))
  .concat(CARDS2.filter(c=>TOPIC_BY_ID[c.topic]).map(c=>({id:c.id, t:c.topic, lv:c.level, q:c.q, k:c.k})));
const LESSONS = /*LESSONS-START*/{"L1":{"idea":"Leverage multiplies the output of your effort, and it comes in four kinds: labor, which is people working for you; capital, which is money working for you; code, which is software; and media, which is content such as videos or posts. Labor and capital need permission, because someone must agree to work for you or to fund you. Code and media need nobody's permission, and an extra copy costs almost nothing. So one piece of work can serve millions of people while you sleep.","example":"You can write an invoice-chasing automation once and sell it to two hundred Dutch bakeries without hiring anyone. You can record one video explaining how you measure closing line value, and it keeps finding viewers for years. Neither needs a boss, a bank or an investor to say yes. Both are open to you today.","trap":"People assume leverage means hiring staff or raising money. Those are the permissioned kinds, and they are the hardest to get when you are just starting.","remember":"Labor and capital need someone's yes; code and media only need you to ship."},"L2":{"idea":"Career capital is Cal Newport's term for the rare and valuable skills you build up over time. You trade that capital for rare and valuable outcomes, such as money, autonomy and control over your work. Newport calls this the craftsman mindset: focus on what you can offer the world, instead of hunting for your passion first. Passion tends to follow, because it usually grows out of mastery, autonomy and impact, and getting good is how you earn all three.","example":"Say building AI automations started as a side interest. Now you can wire a client's inbox, CRM and invoicing together in a week, which few people around you can do. That skill is career capital: you can trade it for higher prices, for picking clients you like, or for setting your own schedule. The more control you win, the more you tend to enjoy the work.","trap":"The common mistake is waiting to find your passion before committing. Newport argues the reverse: passion is usually the result of getting good, not the starting condition.","remember":"Build rare skills first, trade them for control, and passion tends to follow."},"L3":{"idea":"Billing by the hour ties your income to your time, and time has a hard ceiling. A freelancer bills roughly 1,500 to 1,800 hours a year, because sales, admin and holidays eat the rest. To break the link, productize your work with a fixed scope, a fixed price and repeatable delivery; add recurring revenue through retainers or software subscriptions; and own an asset that can be sold, or hire people and earn a margin on their hours.","example":"At 80 euros an hour, 1,500 hours times 80 is 120,000 euros, and 1,800 hours times 80 is 144,000 euros. That is revenue, before tax and business costs. Take the top figure and suppose tax and costs eat about 40 percent, so you keep roughly 86,000 euros. Two million divided by 86,000 is about 23 years, even if you never spend a cent.","trap":"Raising your rate feels like the fix, but doubling it only roughly halves the wait. Your hours are still the ceiling, so the shape of your income never changes.","remember":"Hours have a ceiling; products, subscriptions and equity do not."},"L4":{"idea":"Recurring revenue is predictable: it arrives next month without you winning new sales. It also depends less on the founder, so it can transfer to a buyer. Businesses sell for a multiple of their profit or revenue, and buyers pay a higher multiple for recurring revenue with low churn. Project agencies usually sell for low multiples, because the clients and the know-how tend to leave with the founder.","example":"Ten thousand euros a month is 120,000 euros a year either way. In your agency, that money comes from projects you sold and delivered, so every month starts again at zero. In a software product, a hundred clients each pay 100 euros a month and renew without a call from you. A buyer sees the first as a job they would have to do, and the second as an asset that runs.","trap":"Founders often value a business by this year's revenue alone. Buyers pay for how reliably that revenue continues without you, so churn and founder dependence matter as much as the total.","remember":"Buyers pay for revenue that stays when you leave, not revenue you must win again."},"L5":{"idea":"Skill stacking means being in roughly the top 25 percent at two or three skills that rarely appear together. That combination can beat being top 1 percent at a single skill, because almost nobody else competes in the overlap. A strong idea sits where your skills overlap and where people already spend money. To make it real, name the customer who pays, how you reach them, and why a rival cannot easily copy your mix.","example":"Picture a scouting tool for Dutch tennis academies. Software and AI automation turn match data into a short report, in Dutch, on an opponent's serve and break-point habits. The buyer is the head coach, who already pays for travel and court time, and you reach them by demoing it at regional tournaments. A pure developer lacks the tennis insight, and a tennis analyst cannot build the pipeline.","trap":"The usual mistake is listing skills without naming a buyer. An overlap nobody pays for is a hobby, so start from where money is already being spent.","remember":"Rare skills combined and aimed at existing spending are hard to copy and easy to sell."},"L6":{"idea":"An asymmetric bet has a small, capped downside and a large or even uncapped upside. Optionality is the right, but not the obligation, to go further once you see results. So size each bet small enough that losing barely hurts, run many cheap experiments, cut the losers fast, and double down on the few that show traction. Never risk ruin on a single bet, because one wipeout ends the game.","example":"Say you spend 100 euros on ads to test a landing page for a tennis stats newsletter. Worst case, you lose 100 euros and a weekend; if sign-ups pour in, you may build the product, but you are not obliged to. Set the kill rule first, such as fewer than 30 sign-ups in two weeks means stop. Like your Kelly staking, small stakes keep you alive long enough for a real edge to show.","trap":"People go all in on one exciting idea, or keep a dead experiment alive because of the time already sunk into it. Set the stop signal in advance and obey it.","remember":"Cap the loss, keep the option, kill fast, and never bet the whole bank."},"L7":{"idea":"Start with expected value: the chance of a big exit, times the exit value, times your share after later funding rounds dilute it. Most startups fail, so the honest base case is that the equity is worth zero. Take equity only if cash covers your costs, so the shares are pure upside. Then check vesting, dilution, liquidation preferences and share class, since each can shrink a stake that looks good on paper.","example":"Say, generously, there is a 10 percent chance the startup sells for 20 million euros, and dilution shrinks your 2 percent to 1 percent. Ten percent of 20 million is 2 million, and your 1 percent of that is 20,000 euros. So even optimistic guesses only match the cash, which is certain. A mixed deal, such as 12,000 euros in cash plus 1 percent equity, often beats either extreme.","trap":"The trap is valuing your 2 percent at the latest valuation. A paper valuation is not an exit, and liquidation preferences pay investors back before ordinary shareholders like you.","remember":"Get paid cash for your costs; treat equity as a lottery ticket whose terms you read."},"L8":{"idea":"In Range, David Epstein separates kind environments from wicked ones. Kind environments, like chess or golf, have clear rules, repeating patterns and fast, accurate feedback, so early specialization works. Wicked environments, like most of business, have shifting rules and slow or misleading feedback, and there people who sample broadly and specialize later tend to win. Sampling improves match quality, meaning you find the work you fit best, and a wide background lets you transfer ideas between fields by analogy.","example":"Epstein contrasts Tiger Woods, who swung a golf club as a toddler, with Roger Federer, who played many sports before focusing on tennis in his teens. Golf is kind, which suits early repetition. Business is wicked, and that is where your mix helps: thinking in edges and closing line value from tennis trading can transfer, by analogy, to judging whether a client deal is priced well.","trap":"The mistake is concluding that specialists always lose. Epstein's claim depends on the environment, and in kind domains early, focused practice still wins.","remember":"Specialize early where feedback is kind; sample widely where the world is wicked."},"L9":{"idea":"Weak ties are acquaintances rather than close friends, an idea made famous by sociologist Mark Granovetter in a 1973 paper. Your close friends move in your circles, so they mostly know what you already know. Weak ties bridge into other networks and carry new information, which is why many jobs and deals arrive through them. The practical move is to keep light contact with many people and to share what you build in public, so opportunities can find you.","example":"Your best mate knows the same tennis traders and developers you do. A web designer you met once at a meetup works with forty local shops that need booking automations. One friendly message after you post a demo of your latest automation could bring clients your friends could never have sent. The value sits in the bridge to her network, not in how close you are.","trap":"People think networking means deepening a few strong relationships. Those matter for support, but new opportunities tend to travel through the loose, wide edges of your network.","remember":"Close friends echo what you know; acquaintances bring news from other worlds."},"L10":{"idea":"A salary is capped by your hours and taxed as income, often at the highest rates. An owner captures profit from other people's work, from code and from capital, not just from their own effort. Equity is valued at a multiple of future earnings, so every extra euro of yearly profit can add several euros of sale value. That value compounds as the business grows, and it can be sold in one go.","example":"Take a top employee on 150,000 euros a year and a founder whose company makes 1 million euros profit a year. Say a buyer pays 8 times profit, so the founder sells for 8 million euros in one deal. The employee would need 8 million divided by 150,000, about 53 years of gross salary, to match that. If profit grows to 2 million, the same multiple makes the company worth 16 million.","trap":"People think the rich simply earned huge salaries and saved. Even very high pay is capped by time and income tax, while ownership is valued at a multiple.","remember":"A salary sells your time once; equity sells future profits at a multiple."},"L11":{"idea":"Distribution often matters more than product quality, because a great tool nobody hears about earns nothing. Your options include content such as X threads, YouTube videos or a newsletter; communities where tennis traders already gather; partnerships with coaches or tipsters who have followers; search; and paid ads. Content is the one that counts as media leverage, because it keeps working while you sleep and builds an audience you own. Start building that audience before or while you build the product, not after launch.","example":"Post a weekly thread on how break-point conversion changes by surface, made with your tool's charts. One good thread can keep pulling in followers for months, and every reader you move to your newsletter is yours to reach. Ads stop the moment you stop paying, and a tipster partnership rents someone else's audience.","trap":"Builders assume a good product spreads by itself, then launch to silence. Waiting until the tool is finished to find an audience wastes months you could have spent growing one.","remember":"Content is distribution you own; it keeps selling while you sleep."},"L12":{"idea":"Compounding is growth on growth: each period's gain is added to the base, so the next gain is bigger. By the rule of 72, the years needed to double are roughly 72 divided by the growth rate in percent. Most of the result arrives late in the curve, so the early years look flat. The same maths applies to skills, reputation and an audience, not only money, and stopping or resetting throws away the late payoff.","example":"Grow 10,000 euros at 10 percent a year. 72 divided by 10 is 7.2, so it doubles roughly every 7 years: 20,000, then 40,000, then 80,000, then 160,000 after about 29 years. The first doubling adds 10,000 euros, but the last adds 80,000, more than all the earlier gains put together. A newsletter growing 5 percent a month doubles in roughly 14 months.","trap":"The trap is quitting in the flat part because it looks like failure. Switching niches or cashing out early resets the base and forfeits the steep end of the curve.","remember":"Compounding pays mostly at the end, so protect the base and do not stop."},"P1":{"idea":"The price implies a probability: 1 divided by the decimal odds. Expected value, or EV, is what a bet earns on average: your chance of winning times the net win, minus your chance of losing times the stake. A bet is worth making only when your true probability beats the one the price implies, after commission.","example":"You back at 2.50 for 10 euros, so the implied chance is 1 divided by 2.50, which is 40 percent. A win pays 15 euros profit, and 5 percent commission takes 75 cents, leaving 14.25. EV is 0.45 times 14.25, about 6.41, minus 0.55 times 10, which is 5.50, so about plus 91 cents per bet. It is positive because your 45 percent beats the 40 percent the price implies.","trap":"Forgetting commission. It cuts the win to 14.25, which lifts your break-even chance from 40 to about 41 percent, so a thin edge can vanish.","remember":"Edge means your probability beats the price's probability, after commission."},"P2":{"idea":"Closing line value, or CLV, compares the price you took with the final price just before the event or point is decided. That closing price is the market's sharpest estimate, because it has absorbed the information and money that arrived after you bet. Profit over a small sample is dominated by luck, while CLV settles much faster. Consistently beating the close is the best evidence of a real edge, as long as the closing market is efficient.","example":"You back the breaker at 2.00, an implied 50 percent. Just before the next point starts, the price is 1.90, which implies about 52.6 percent. You got a price about 5 percent better than the close. If he is then broken back and you lose, profit says bad trade, but CLV says you bought well.","trap":"Forgetting the efficiency condition. In a thin, low-liquidity match the closing price can be noisy too, so trust CLV most in liquid markets.","remember":"Over small samples, profit measures luck; beating the close measures skill."},"P3":{"idea":"A return over a small sample carries a lot of noise. At odds near 2.0 each bet wins or loses about one stake, so the standard deviation per bet is about one stake. The standard error of your return on investment, or ROI, is then about 1 divided by the square root of the number of bets. A result starts to convince only when it sits about two standard errors or more above zero.","example":"With 150 bets, the square root of 150 is about 12.2, so the standard error is 1 divided by 12.2, about 8.2 percent. Your plus 12 percent is 12 divided by 8.2, only about 1.5 standard errors. A strategy with zero edge would show a result this good roughly 7 percent of the time. The plausible range for your true ROI runs from about minus 4 to plus 28 percent.","trap":"Treating a good-looking ROI as proof. You need many more bets, or supporting CLV evidence, before you trust it with bigger stakes.","remember":"ROI noise is about 1 divided by the square root of your bet count."},"P4":{"idea":"The Kelly criterion tells you what fraction of your bank to stake: b times p, minus q, all divided by b. Here b is the decimal odds minus 1, p is your win chance, and q is 1 minus p. Staking this way maximises the long-run growth of your bankroll. But full Kelly is very volatile, with roughly a 50 percent chance of halving your bank at some point.","example":"Say you back at 2.0 and believe the true chance is 55 percent, ignoring commission. Then b is 1, p is 0.55 and q is 0.45. Kelly is 1 times 0.55, minus 0.45, divided by 1, which is 0.10, or 10 percent of the bank. With a 400 euro bank, full Kelly is 40 euros, half Kelly 20, and quarter Kelly 10.","trap":"Trusting your own edge estimate, which is noisy, when overbetting hurts far more than underbetting: twice Kelly drives growth to about zero, while half Kelly keeps about three quarters of it. That is why pros bet half or quarter Kelly.","remember":"Kelly sets the ceiling; bet a half or a quarter of it."},"P5":{"idea":"When you test several ideas and pick the best, you also pick the one that got luckiest. This is the multiple comparisons problem, and the inflated winner is the winner's curse. Choosing details like the odds band after seeing the data adds overfitting on top. So expect live results to regress toward the mean.","example":"Imagine all six situations had zero true edge and 150 bets each. Each result would carry noise of about 8 percent, and the best of the six would show roughly plus 10 percent on average, from luck alone. If you then set the band at exactly 1.5 to 2.5 because that slice looked best, part of its edge is fitted noise. The fix is to forward-test on new matches, out of sample, demand larger samples, and discount the backtested edge.","trap":"Treating the backtest winner's edge as the true edge and sizing Kelly stakes on it, which means overbetting.","remember":"The best of many backtests is partly the luckiest, so discount it and test forward."},"P6":{"idea":"Any extreme result is part skill and part luck. Skill tends to persist, but luck does not, so the next measurement usually lands closer to the average. That is regression to the mean. The smaller the sample, the more of an extreme result is luck, and the stronger the pull back.","example":"A player has saved 80 percent of his break points, 16 out of 20. Twenty chances is tiny: if just two had gone the other way, he would be at 70 percent. Over his next 20 break points, expect a rate that drifts toward the tour average. If you price his next break point as if 80 percent were his true level, you overrate him.","trap":"Crediting or blaming a change for what was just regression. After your worst month you tweak the strategy, the next month is better, and you think the tweak worked.","remember":"Extreme results drift back, because the luck in them does not repeat."},"P7":{"idea":"Base rate neglect means judging one specific case only on its own details, while ignoring how often that kind of thing happens in general. The outside view fixes it. First find a reference class of similar cases and its base rate, then adjust modestly for what is really different about yours. Kahneman found that plans built only from the inside view are systematically too optimistic.","example":"You plan a software product, and your inside view says 1 million euros a year, because clients love the demo. The outside view asks first: of new software products like this, how many ever reach 1 million euros a year? Only a small minority do. Start from that low base rate, then nudge it up a little for real advantages, such as existing clients and a way to reach buyers.","trap":"Believing your case is so special that the base rate does not apply, or adjusting so far from it that you are back at the inside view.","remember":"Start from how often it happens to everyone, then adjust a little."},"P8":{"idea":"A public record shows only the survivors. Many tipsters start, the losers quit or delete their accounts, and you see only who is left. That is survivorship bias. So before believing a streak, check that the record is verifiable and large enough, that it beat the market, and how the tipster gets paid.","example":"The account shows 40 green months, so first ask how many accounts like it started, and where the failed ones went. Were the tips timestamped before the matches, at prices you could really have matched on Betfair? Then ask for the number of bets, the average odds, the staking, and whether the picks beat the closing price. Finally, does he earn from subscriptions or affiliate deals, which pay him even when followers lose?","trap":"Counting winning months instead of measuring edge. Staking tricks like chasing losses within a month can turn most months green while hiding rare large losses.","remember":"Ask who you are not seeing, and what the tipster earns when you lose."},"P9":{"idea":"Kahneman and Klein agreed that a gut instinct deserves trust only under two conditions. The environment must have stable, regular patterns, which they call high validity. And you must have had lots of practice with fast, clear feedback. Without both, intuition can still feel confident, but feeling confident is not evidence that it is right.","example":"Chess players and firefighters meet both conditions, so their snap judgments are often good. Stock pickers and long-range forecasters do not, so their confidence outruns their accuracy. For you, a gut feel about a bug gets fast, clear feedback when the test passes or fails. A gut feel that a tennis price is wrong gets noisy feedback, because one result says little, so check it against CLV and data.","trap":"Trusting a hunch because it feels strong. The strength of the feeling says nothing about whether the environment let real skill form.","remember":"Trust intuition only where patterns are regular and feedback is fast and clear."},"P10":{"idea":"Tennis scoring is nested: points make games, games make sets, and sets make the match. Each layer amplifies a small edge, because you must win several small units to take the bigger one. Winning 62 percent of service points means holding serve about 78 percent of the time, and best of five amplifies more than best of three. Some points, like break points, matter far more than others, so prices swing most there.","example":"Take two players who win 64 and 62 percent of their service points. The first wins only about 51 percent of all points, yet a simple model where every point is independent gives him about 60 percent to win best of three, and about 62 percent in best of five. Your breaker trade lives on this: after a break, you are really betting on the breaker's next service game.","trap":"Thinking that knowing about amplification is an edge. The market knows it too, so your edge comes only from the market mispricing those swings, such as how often a breaker consolidates.","remember":"Small point edges compound into big match edges, and prices swing hardest at break points."},"P11":{"idea":"Bayesian updating means starting from a prior belief and shifting it by how strongly new evidence points one way. The posterior is proportional to the prior times the likelihood of the evidence. In odds form, new odds equal old odds times how many times more likely the evidence is under one story than the other. Losing a set is real evidence, but a strong prior should not be thrown away.","example":"Rated 60 percent, the favourite starts at odds of 60 to 40, which is 1.5. In a simple best of three model, losing the first set is about three times as likely in matches he goes on to lose as in matches he wins. So 1.5 divided by 3 gives odds of 0.5, about 33 percent. That is still better than the 25 percent an even player has after losing a set.","trap":"Forgetting the market updates too. If it now offers 4.0, an implied 25 percent, it may have overreacted; edge exists only when it over- or
