iple depends on.","remember":"Reciprocity, consistency, social proof, liking, authority, scarcity and unity: only pull the true ones."},"SA4":{"idea":"Neil Rackham sorted the outcomes of sales calls into an order, an advance, a continuation or no sale. An advance means the buyer commits to a specific action that moves the deal forward, like introducing the decision-maker or booking a proposal review. A continuation sounds friendly, like 'great chat, send me something', but nobody has committed to anything. He also found that pressure closing techniques tended to hurt in larger sales, so aim most calls at a realistic advance, not a signature.","example":"Before a call with a dental practice, decide the best realistic advance: a thirty-minute walkthrough of your plan with both partners. Near the end, ask directly whether you can book Thursday at ten with both of them to go through it. If they agree, send the calendar invite before you hang up. If they only say 'send me something', that's a continuation, so ask what they'd need to see to decide.","trap":"Counting continuations as progress. A pipeline full of calls that ended with 'sounds interesting' feels busy but predicts almost nothing.","remember":"End every call with a specific, dated commitment from the buyer, not just good feelings."},"SA5":{"idea":"Pipeline maths works backwards from your goal through each stage of your sales process. At each stage, divide the number you need by that stage's conversion rate to find what the stage before it must produce. This turns a vague wish for more clients into a daily number you can act on. It also shows where to improve, because every rate multiplies through the whole chain.","example":"Two clients divided by one third is 6 proposals. Six proposals divided by one half is 12 sales calls. Twelve calls divided by 2 percent is 600 cold emails a month, or about 30 each working day if a month has 20. If better targeting doubled the email rate to 4 percent, you would need only 300 emails, and doubling your proposal close rate would have the same effect.","trap":"Planning with made-up rates forever. Start with estimates, replace them with your own tracked numbers, and remember that deals take weeks, so today's emails become next month's clients.","remember":"Divide the goal by each conversion rate, stage by stage, to get your daily activity."},"SA6":{"idea":"An objection is usually a worry the buyer hasn't fully explained, so treat it as information, not an attack. A common sequence is to listen fully, acknowledge the concern, ask questions to find the real issue, answer that specific issue, then check that it's resolved. Proof beats promises, so answer with a similar client's result or a concrete difference in how you work. If the worry is risk, shrink it with a smaller first step.","example":"Start by saying that makes sense, you'd be careful too, and ask what went wrong. Suppose the last agency built a chatbot and vanished when it broke, so his real objection is support, not automation. Explain your support plan with a named contact and a fixed response time, and offer a four-week paid pilot with an agreed success measure. If that solves his worry, book the start date.","trap":"Answering the objection you assume instead of the one he has. Defending automation in general misses that his real fear was being abandoned after launch.","remember":"Acknowledge, ask what really went wrong, answer that one concern, then agree a next step."},"SA7":{"idea":"Cold outreach gets replies when it is relevant, short and easy to answer. Relevance means a tight list of good-fit prospects and a first line showing you looked at their business. The body names one problem and one outcome in their terms, about them, not you. End with a low-effort question, like whether it's worth a quick look, not a request for a thirty-minute meeting.","example":"Open with: I messaged you on Sunday evening and got an auto-reply promising an answer on Monday, and a buyer who waits that long may call the next agent. Then say you build assistants that answer enquiries and book viewings around the clock, and ask if a two-minute demo video is worth a look. If there's no reply, follow up days later with that video, then with a result from a similar office, then a short final note.","trap":"Writing about yourself: your agency, your tools, your experience. The prospect cares about their own problem, and a long pitch from a stranger reads like spam.","remember":"Relevant, short, about them, one easy question, then follow-ups that each add something new."},"SA8":{"idea":"Clients don't want your hours; they want a result, like more booked jobs or fewer admin hours. Build the case from the client's own numbers, gathered in discovery, and show the payback period: your price divided by the monthly gain. Next to that value, your price gets compared with the result, not with your hourly rate. Hourly pricing also punishes you for getting faster, and AI tools make you faster every month.","example":"A plumber says he misses about 20 enquiries a month after hours, books about a quarter of the ones he answers, and makes about 300 euros profit per job. Twenty times a quarter is 5 jobs, and 5 times 300 is 1,500 euros a month, so a 4,500 euro build pays back in 4,500 divided by 1,500, which is 3 months. Billed hourly, the same 30 hours at 80 euros would earn you only 2,400 euros.","trap":"Inventing or inflating the numbers. Use the client's own figures and round down, because one number they don't believe sinks the whole case.","remember":"Sell the result in the client's numbers, show the payback, and stop pricing by the hour."},"SM1":{"idea":"Urge surfing is a technique from the psychologist Alan Marlatt's work on relapse prevention, and Sarah Bowen, working with Marlatt, later built it into mindfulness-based relapse prevention. The core idea is that an urge behaves like a wave. It builds, peaks and then fades on its own, as long as you do not feed it by acting. Fighting or arguing with an urge can keep it going, so you watch it instead.","example":"Say it is late and you feel the pull to grab your phone and scroll. Pause and ask where you feel it: a tight chest, restless hands, a buzz in your stomach. Breathe slowly and tell yourself, this is an urge, it is rising, and it will pass. Keep noticing how the feeling shifts until it drops away.","trap":"The mistake is waiting for urges to stop before you feel in control. The goal is not zero urges, but urges that no longer give the orders.","remember":"Notice it, breathe, name it, and let the wave pass without obeying it."},"SM2":{"idea":"Alan Marlatt and Judith Gordon described the abstinence violation effect in their relapse prevention model. After breaking a firm rule, people often think: I have blown it, so why stop now. That all or nothing thought, plus guilt and blaming your whole character, turns one lapse into a relapse. A lapse is a single slip, while a relapse is sliding back into the old pattern.","example":"So Tuesday is a lapse, not proof that the week is lost, and you treat it as data. What happened just before you picked up the phone? Maybe you were tired and it was lying on the nightstand, so tonight it charges in the kitchen and you are back on plan. A popular rule of thumb sums it up: never miss twice.","trap":"The common mistake is treating one slip as proof of who you are. That belief is what turns one bad night into a lost week.","remember":"A lapse is data, not a verdict, so never miss twice."},"SM3":{"idea":"Wilhelm Hofmann and colleagues asked people about their desires at random moments through the day. People high in self-control did not resist more. They reported fewer temptations and resisted less often, because their lives were set up to meet fewer of them. Angela Duckworth and colleagues argue that changing your situation works earlier, and more reliably, than willpower in the moment.","example":"If you lose evenings to games or videos, log out and move the app off your home screen. Every extra step is friction. Do the reverse for good habits: lay out your gym clothes the night before, or leave the hard task open on your screen. Make the good path the easy one.","trap":"Many people still picture willpower as a fuel tank that runs dry. That idea, called ego depletion, failed large replications across many labs, so do not build your plan on it.","remember":"Design your surroundings so you need less willpower, not more."},"SM4":{"idea":"In 1978, Steven Berglas and Edward Jones described self-handicapping: before a test of ability, people sometimes hold back effort or create an obstacle, so a failure can be blamed on that instead of on themselves. It protects your self-image today, but over time it is linked to worse results. William Swann's self-verification theory adds a second force. People tend to seek feedback that confirms how they already see themselves, and in his studies this held even for negative self-views.","example":"The night before a big pitch, you stay up late on something else and barely prepare. If it goes badly, you can blame tiredness, not your ability. Or a client praises your work, and you brush it off because it does not fit the story you tell about yourself.","trap":"The mistake is calling this laziness. It is often a way to protect your self-image, so name the fear instead of just pushing harder.","remember":"Holding back protects your ego today and costs your results tomorrow."},"SM5":{"idea":"In a 2012 set of experiments, Juliana Breines and Serena Chen found that people guided to treat a failure with self-compassion were more motivated to improve. In one study, students who failed a hard test and were then encouraged to be kind to themselves studied longer for a retest than students given a self-esteem boost or nothing. Kristin Neff describes three parts: kindness to yourself, remembering that everyone fails, and noticing the pain without drowning in it.","example":"So swap the insults for what you would tell a friend. That was a costly mistake, every trader makes them, and you can learn from it. Then do the useful part. Write down which rule you broke and when, and set one concrete fix for tomorrow.","trap":"People fear that kindness makes them soft. It is not letting yourself off the hook, because you still own the mistake and fix it.","remember":"Be kind about the failure and strict about the fix."},"SM6":{"idea":"HALT stands for hungry, angry, lonely and tired. It comes from addiction recovery programs as a practical check, not from controlled research, but it captures something useful. Urges tend to hit harder when a basic need is unmet. Add boredom, late nights and being alone with a phone, and you have a list of high risk moments.","example":"Here several of them stack up, because you are hungry, wound up, tired and alone with a screen. So treat the urge as a signal. Eat something real, put the phone in another room, then go to bed or call a friend. Tomorrow, write a short log entry: the time, the place, how you felt and what came just before.","trap":"The mistake is treating every slip as a willpower failure. Logged over a few weeks, slips become a map of where to change your environment.","remember":"Before you fight an urge, ask what you actually need right now."},"SM7":{"idea":"The psychologist Daryl Bem proposed self-perception theory in the late 1960s. People often work out who they are the way an outsider would, by watching what they do. This is strongest when your inner sense of yourself is weak or unclear. It is one explanation for the foot in the door effect: after agreeing to a small request, people see themselves as helpful and agree to bigger ones.","example":"So build evidence. Promise yourself one small, specific thing each day, such as ten minutes on the hard task before email, and keep it. At night, write a few lines in a win log about what you said you would do and did. After a few weeks you have a written record that contradicts the old story.","trap":"The mistake is making big promises and breaking them. Each broken promise is evidence too, so start small enough that you almost always keep it.","remember":"You learn who you are by watching what you do, so give yourself proof."},"SM8":{"idea":"Sexual desire is a normal, healthy part of being human. The goal is not to kill it, but to act in line with your own values. Research by Joshua Grubbs and colleagues found that feeling addicted to pornography is strongly linked to moral disapproval and shame, not only to how much someone watches. Shame and secrecy can feed a loop: a slip, then shame, then hiding, then stress, which can make the next urge harder to resist.","example":"So work on your setting and your response. Keep your phone out of the bedroom, and when an urge rises, surf it and run the HALT check. Have a replacement action ready, such as a walk, a workout or a call. Tell one trusted person about your goal, so it is not a secret.","trap":"The common mistake is answering a lapse with self-attack. Meet it with self-compassion and learn from it, and if it feels out of control, a therapist trained in CBT can help.","remember":"Desire is normal; act on your values and meet slips with honesty, not shame."},"WI1":{"idea":"Epictetus, a former slave turned Stoic teacher, split the world in two. Some things are up to us: our judgments, our choices and our actions. Others are not fully up to us: outcomes, our body, our reputation and what other people do. He taught that we are upset less by events than by our judgments about them, so we should put our effort where we have control and accept the rest calmly.","example":"On Betfair you control your model, your staking rules and how cleanly you execute. You do not control whether a player double faults on break point, or how the market moves. So score each trading day on process: did you follow the model, size every bet correctly and skip impulsive trades? A losing day with perfect process is a good day.","trap":"The mistake is using this as an excuse to stop trying. Most things are partly in your control, so work hard on your part of them.","remember":"Own your choices and actions, accept outcomes, and judge yourself on process."},"WI2":{"idea":"The scholar Alfred Korzybski coined the phrase in the 1930s. A model or description of reality is not reality itself. Every map leaves things out, and that is exactly what makes it useful, but it also means the map can be wrong in ways you cannot see from the map. The statistician George Box put it this way: all models are wrong, but some are useful.","example":"Your tennis backtest is a map. It assumes you get matched at the price in the data. The live market adds delays, thin liquidity, suspended markets and traders with faster data. If live results drift away from the backtest, the market is not wrong; your map is missing something, so go and find it.","trap":"The common mistake is defending the model when reality disagrees with it. Update the map, not your view of the territory.","remember":"Models are maps, and when reality disagrees, reality wins."},"WI3":{"idea":"Second-order thinking means looking past the first effect of a decision to the effects that follow. You keep asking and then what, over months rather than days, and for every group the decision touches. The investor Howard Marks calls this second-level thinking. The first effect is usually obvious and positive, while later effects are often bigger and harder to see.","example":"The first-order effect of the discount email is clear: more carts recovered and a sales bump this month. And then what? Some regular customers may learn that leaving a cart brings a code, so they wait, and full-price sales and margins fall. A better design sends a plain reminder first, limits codes to once per customer, and tests the flow against a control group that gets no email.","trap":"The usual mistake is judging a decision by its first week of results. The bill for many good-looking ideas arrives later.","remember":"Always ask and then what, because the later effects often matter most."},"WI4":{"idea":"Via negativa is Latin for the negative way. Nassim Taleb uses it in his book Antifragile to mean improving by subtraction: removing what harms you instead of adding what might help. He argues that we know more reliably what hurts than what helps, and that adding something brings side effects you cannot foresee, while removing a known harm usually does not. A 2021 study in Nature by Gabrielle Adams and colleagues found that people systematically overlook subtraction when they try to improve things.","example":"Before adding a sixth filter to your tennis model, test what happens if you remove the weakest two. Before buying another productivity app, drop the client who pays late and wants weekly calls. Before adding features to a client's app, ask which screens nobody uses.","trap":"The mistake is treating every problem as a gap to fill. Ask what to remove before you ask what to add.","remember":"Before you add anything, ask what you could take away."},"WI5":{"idea":"Warren Buffett and Charlie Munger use the circle of competence to mean the areas where you truly understand how things work. In his 1996 letter to shareholders, Buffett wrote that the size of the circle is not very important, but knowing its boundaries is vital. Inside it, you can judge risk. Outside it, you are guessing while feeling sure.","example":"Your edge in tennis comes from knowing its scoring, its data and the traders on the other side. Football and horse racing have different data, different market structures and different opponents, often specialists with years of work behind them. Ask yourself: can I explain why I would win, and who is losing to me? If not, stay out, or expand the circle on purpose with research, paper trading and then tiny stakes.","trap":"The common mistake is assuming success in one field carries over to a nearby one. Results inside your circle can make you overconfident outside it.","remember":"Know exactly where your circle ends, and stay inside unless you are deliberately expanding it."},"WI6":{"idea":"In 1929 the writer G. K. Chesterton described a reformer who finds a fence across a road. The reformer sees no use for it and wants it cleared away. The wiser reply is: first find out why it was built, and then you may remove it. The rule is simple: do not remove something until you know why it was put there.","example":"That ten-minute delay may wait for a slow payment provider to confirm the order, give customers time to cancel a mistake, or avoid a rate limit. Ask the client, read the change history, check the logs and test the change in a copy first. If the reason is gone or no longer worth it, remove the step in a way you can easily undo.","trap":"Some people turn this into a rule against all change. It only asks you to understand before you change.","remember":"Before you remove a fence, find out why someone built it."},"WI7":{"idea":"Hedonic adaptation means people get used to most changes, good or bad, and drift back toward their usual level of happiness. Philip Brickman and Donald Campbell called this the hedonic treadmill in 1971. Later research softened the idea: adaptation is often incomplete, and some events leave lasting marks. More money does tend to raise life satisfaction on average, but each extra euro adds less.","example":"Picture your first million in the bank. The relief is real, but a new car or a bigger flat soon feels normal, and you start eyeing the next number. So aim wealth at things that keep paying off, like freedom over your time and security for your family. Research by Elizabeth Dunn and others suggests that spending on experiences, on other people and on buying back time brings more lasting happiness than buying things.","trap":"The mistake is believing one more milestone will finally make you happy. Enjoy the process, because you will live in it far longer than at the finish line.","remember":"You adapt to every win, so build a life you enjoy along the way."},"WI8":{"idea":"Inversion means flipping a problem around. Instead of asking how to succeed, you ask what would guarantee failure, and then you avoid those things. The nineteenth-century mathematician Carl Jacobi advised: invert, always invert. Charlie Munger made it famous in business and joked that he only wanted to know where he would die, so he would never go there.","example":"Take the goal of growing your agency to a hundred thousand euros of yearly profit. Invert it: how would you make sure it fails? Depend on one big client, underprice fixed-scope work, never follow up on leads and let every project creep. Now turn each item into a rule: no client above a third of revenue, written scope with change fees, and a weekly follow-up block.","trap":"The mistake is treating inversion as pessimism. You still plan forward, but you first remove the predictable ways to lose, because avoiding stupidity is often easier than being brilliant.","remember":"To get what you want, first list what would ruin it, then avoid it."}}/*LESSONS-END*/;

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
function el(tag, props, ...kids){
  const n=document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v==null||v===false) continue;
    if(k==="class") n.className=v;
    else if(k==="text") n.textContent=v;
    else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v===true?"":String(v));
  }
  for(const c of kids.flat(3)){ if(c==null||c===false) continue; n.append(c.nodeType?c:document.createTextNode(String(c))); }
  return n;
}
const strArr = x => Array.isArray(x) ? x.map(v=>String(v)).filter(s=>s.trim()).slice(0,6) : [];
function dayStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return dayStr(new Date()); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return dayStr(d); }
function dueAt(days){ const d=new Date(); d.setHours(4,0,0,0); d.setDate(d.getDate()+days); return d.getTime(); }
function daysUntil(ts){ const a=new Date(); a.setHours(0,0,0,0); const b=new Date(ts); b.setHours(0,0,0,0); return Math.round((b-a)/864e5); }
function gapText(d){ return d<=1 ? "tomorrow" : "in "+d+" days"; }

function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({progress:state.progress, extra:state.extra, lessons:state.lessons, math:state.math, game:state.game, meta:state.meta})); }catch(e){} }

const writeChains=new Map();
function writeDoc(path, data){
  lsSave();
  if(!db) return Promise.resolve();
  const prev=writeChains.get(path)||Promise.resolve();
  const next=prev.catch(()=>{}).then(()=>db.doc(path).set(data)).catch(e=>{
    if(e && e.code==="unavailable"){ return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(()=>db.doc(path).set(data)); }
    throw e;
  }).catch(e=>{
    state.store = (e && e.code==="quota_exceeded") ? "full" : "writefail";
    if(!drill) renderHome();
  });
  writeChains.set(path,next);
  return next;
}

function allCards(){
  const ex=Object.entries(state.extra)
    .filter(([,c])=>c && TOPIC_BY_ID[c.t] && c.q && LEVEL_NAME[c.lv])
    .sort((a,b)=>(a[1].created||0)-(b[1].created||0))
    .map(([id,c])=>({id, t:c.t, lv:c.lv, q:String(c.q), k:strArr(c.k), gen:true}));
  return CARDS.concat(ex);
}

/* ---------- scheduling ---------- */
function orderNew(cards){
  const lists=TOPICS.map(t=>cards.filter(c=>c.t===t.id));
  const out=[]; let added=true;
  while(added){ added=false; for(const l of lists){ if(l.length){ out.push(l.shift()); added=true; } } }
  return out;
}
function interleave(cards){
  const rest=cards.slice(), out=[];
  while(rest.length){
    const prev=out.length?out[out.length-1].t:null;
    let i=rest.findIndex(c=>c.t!==prev); if(i<0) i=0;
    out.push(rest.splice(i,1)[0]);
  }
  return out;
}
function pickSession(topicId){
  const N=5, MAXNEW=topicId?N:3, now=Date.now();
  const cards=allCards().filter(c=>!topicId||c.t===topicId);
  const P=state.progress;
  const due=cards.filter(c=>P[c.id]&&P[c.id].due<=now).sort((a,b)=>P[a.id].due-P[b.id].due);
  const fresh=orderNew(cards.filter(c=>!P[c.id]));
  const dueTake=Math.min(due.length, N-Math.min(MAXNEW,fresh.length));
  let pick=due.slice(0,dueTake);
  pick=pick.concat(fresh.slice(0,N-pick.length));
  if(pick.length<N) pick=pick.concat(due.slice(dueTake, dueTake+(N-pick.length)));
  if(pick.length<N){
    const later=cards.filter(c=>P[c.id]&&!pick.includes(c)).sort((a,b)=>P[a.id].due-P[b.id].due);
    pick=pick.concat(later.slice(0,N-pick.length));
  }
  return interleave(pick);
}
function applyScore(card, score, g, answer){
  const p=state.progress[card.id]||{box:0,reps:0,hist:[]};
  let box=p.box||0;
  if(score>=4) box=Math.min(box+1,6);
  else if(score===3) box=Math.max(box,1);
  else box=1;
  if(score===5 && !p.reps) box=2;
  const np={box, reps:(p.reps||0)+1, due:dueAt(INTERVALS[box]), last:Date.now(), lastScore:score,
    best:Math.max(p.best||0,score), hist:(p.hist||[]).concat([score]).slice(-12),
    missed:g?strArr(g.missed).slice(0,5):[], ans:String(answer||"").slice(0,2000)};
  state.progress[card.id]=np;
  writeDoc("cards/"+card.id, np);
  return np;
}
function bumpStreak(){
  const t=todayStr(), m=Object.assign({}, state.meta);
  if(m.lastDay===t) m.answered=(m.answered||0)+1;
  else { m.streak=(m.lastDay===yesterdayStr())?(m.streak||0)+1:1; m.lastDay=t; m.answered=1; }
  m.total=(m.total||0)+1;
  state.meta=m; writeDoc("meta/state", m);
}
function streakNow(){ const m=state.meta; return (m.lastDay===todayStr()||m.lastDay===yesterdayStr())?(m.streak||0):0; }
function topicStats(tid){
  const cs=allCards().filter(c=>c.t===tid); const P=state.progress;
  let sum=0, seen=0; const teach=cs.filter(c=>c.lv==="teach");
  cs.forEach(c=>{ if(P[c.id]){ seen++; sum+=Math.min(P[c.id].box||0,6)/6; } });
  const mastery=cs.length?sum/cs.length:0;
  const ready=teach.length>0 && teach.every(c=>P[c.id]&&(P[c.id].best||0)>=4) && mastery>=0.5;
  return {cards:cs, seen, mastery, ready};
}

function normGrade(r){
  r=r||{};
  let s=Math.round(Number(r.score)); if(!isFinite(s)) s=0; s=Math.max(0,Math.min(5,s));
  return {score:s, verdict:String(r.verdict||""), got:strArr(r.got), missed:strArr(r.missed), model:String(r.modelAnswer||""), followup:String(r.followup||"").trim()};
}
async function callGrade(prompt, signal){
  const r=await sample.json(prompt, {modelTier:"default", effort:"low", signal});

}
function sampleErrMsg(e){
  const c=e&&e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){
    gradingOff=true; return "Claude grading is off for this page, so score yourself against the key points.";
  }
  if(c==="cancelled") return "";
  if(c==="rate_limited") return "Claude is busy or you've hit a usage limit. Try again in a minute, or score yourself.";
  if(c==="session_expired") return "Sign in to Claude again, then tap Grade.";
  if(c==="invalid_json") return "The grade came back garbled. Tap Grade again.";
  if(c==="refused") return "Claude wouldn't grade that answer. Rephrase it and try again.";
  return "Grading failed. Check your connection and tap Grade again.";
}

function voiceScore(v){
  const n=v.name.toLowerCase(); let s=0;
  if(/premium/.test(n)) s+=60;
  if(/neural|natural/.test(n)) s+=55;
  if(/siri/.test(n)) s+=50;
  if(/enhanced/.test(n)) s+=45;
  if(/google/.test(n)) s+=30;
  if(v.localService===false) s+=5;
  if(/^en[-_](gb|us)/i.test(v.lang)) s+=3;
  if(JUNK.test(n)) s-=100;
  return s;
}
function loadVoices(){
  if(!canSpeak) return;
  try{ voices=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a)); }catch(e){ voices=[]; }
  if(!drill&&!reader) renderHome();
}
function bestVoice(){ return (voiceName&&voices.find(v=>v.name===voiceName)) || voices[0] || null; }
function speak(text){
  if(!canSpeak||!text) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); const v=bestVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-GB"; u.rate=1; speechSynthesis.speak(u); }catch(e){}
}
function hush(){
  if(player){ try{ player.pause(); }catch(e){} player=null; }
  if(canSpeak) try{ speechSynthesis.cancel(); }catch(e){}
}
function play(key, text){
  hush();
  const src=key&&AUDIO[key];
  if(src){
    try{
      const a=new Audio(src); player=a;
      const p=a.play(); if(p&&p.catch) p.catch(()=>{ if(player===a){ player=null; speak(text); } });
      return;
    }catch(e){ player=null; }
  }
  speak(text);
}

 {id:"frac", name:"Fractions to percents",

 {id:"pctof", name:"Percent of a number",

 {id:"implied", name:"Odds to probability",

 {id:"fairodds", name:"Probability to fair odds",

 {id:"backprofit", name:"Back bet profit after commission",
  lesson:{idea:"Profit on a winning back bet is stake × (odds − 1). The exchange takes commission from that profit, not from your stake.",
   example:"€20 at 3.00: gross profit is 20 × 2 = €40. With 5% commission you keep 95%: 40 × 0.95 = €38.",
   trick:"Commission quietly lowers your real odds. At 5%, odds of 3.00 behave like 2.90, because the profit part, 2.00, becomes 1.90."},
  gen(){ const s=pick([5,10,20,25,40,50]); const o=pick([1.5,1.8,2,2.2,2.5,3,3.5,4]); const c=pick([0,2,5]); const g=s*(o-1); const v=g*(1-c/100);

 {id:"lay", name:"Laying: liability and winnings",
  lesson:{idea:"Laying means you act as the bookmaker. If the player loses, you win the backer's stake. If the player wins, you pay the backer's profit: stake × (odds − 1). That is your liability.",

  gen(){ const s=pick([5,10,20,25,50]); const o=pick([1.5,1.8,2,2.5,3,4,4.5,6]);

 {id:"ev", name:"Expected value",
  lesson:{idea:"Expected value is the average result per bet if you repeated it many times. EV = chance of winning × amount won − chance of losing × amount lost.",
   example:"Back €10 at 2.50 with a 45% chance: the win amount is 10 × 1.5 = 15. EV = 0.45 × 15 − 0.55 × 10 = 6.75 − 5.50 = +€1.25 per bet.",
   trick:"Quick check: if your probability beats the implied probability, EV is positive before commission. EV divided by the stake is your edge, here 12.5%."},
  gen(){ const s=pick([10,20,50]); const o=pick([1.8,2,2.2,2.5,3,4]); const imp=100/o; const p=Math.max(5,Math.min(90,Math.round(imp+pick([-6,-4,-3,3,4,5,6,8])))); const c=pick([0,0,5]); const w=s*(o-1)*(1-c/100); const v=p/100*w-(1-p/100)*s;

  lesson:{idea:"Your break-even win rate is the probability at which EV is exactly zero. Without commission it equals the implied probability, 1 ÷ odds. Commission pushes it up.",
   example:"Odds 2.00 with 5% commission: you win 0.95 per euro risked. Break-even = 1 ÷ (1 + 0.95) = 51.3%, not 50%.",
   trick:"General formula: 1 ÷ (1 + net win per euro), where net win per euro = (odds − 1) × (1 − commission). Know your break-even before judging any strategy."},
  gen(){ const o=pick([1.5,1.8,2,2.2,2.5,3,4]); const c=pick([0,5]); const n=(o-1)*(1-c/100); const v=100/(1+n);
   return {q:"At odds of "+od(o)+(c?" with "+c+"% commission":" with no commission")+", what win rate do you need to break even? Round to 1 decimal.", a:v, tol:0.06, unit:"%", steps:c?("Net win per euro = "+fmt(o-1,2)+" × "+fmt(1-c/100,2)+" = "+fmt(n,4)+". Break-even = 1 ÷ (1 + "+fmt(n,4)+") = "+fmt(v/100,4)+", so "+fmt(v,1)+"%."):("Without commission, break-even = 1 ÷ "+od(o)+" = "+fmt(v,1)+"%.")}; }},
 {id:"sqrt", name:"Square roots by estimate",
  lesson:{idea:"The square root of n is the number that, times itself, gives n. You need it for standard errors and sample sizes.",
   example:"Square root of 150: 12 squared is 144 and 13 squared is 169. 150 is 6 of the 25 steps from 144 to 169, about a quarter of the way, so roughly 12.2.",
   trick:"Learn the squares from 10 to 20, plus the round ones: the square root of 100 is 10, of 400 is 20, of 900 is 30, of 2,500 is 50, and of 10,000 is 100. Then estimate in between."},
  gen(){ const n=pick([2,10,50,80,120,150,200,300,500,1000,2000,4400]); const v=Math.sqrt(n); const lo=Math.floor(v), hi=lo+1; const est=lo+(n-lo*lo)/(hi*hi-lo*lo);
   return {q:"Estimate the square root of "+loc(n)+" to 1 decimal.", a:v, tol:Math.max(0.12,v*0.006), unit:"", steps:lo+"² = "+loc(lo*lo)+" and "+hi+"² = "+loc(hi*hi)+". "+loc(n)+" is about "+fmt((n-lo*lo)/(hi*hi-lo*lo)*100,0)+"% of the way between, so roughly "+fmt(est,1)+". Exact: "+fmt(v,2)+"."}; }},
 {id:"se", name:"Standard error of ROI",
  lesson:{idea:"At odds near 2.0, each bet wins or loses about one stake. Over n bets, the noise in your ROI shrinks like 1 ÷ √n. That number is the standard error.",
   example:"After 400 bets: 1 ÷ √400 = 1 ÷ 20 = 5%. An ROI of +8% is 8 ÷ 5 = 1.6 standard errors: not yet convincing. You want about 2 or more.",
   trick:"To halve the noise you need four times as many bets. That's why closing line value, which settles much faster, is the better early signal."},
  gen(){ const n=pick([100,144,225,400,625,900,1600,2500,10000]); const se=100/Math.sqrt(n);

   const roi=pick([3,4,5,6,8,10,12,15]); const z=roi/se;
   return {q:"Your ROI is plus "+roi+"% over "+loc(n)+" bets at odds near 2.0. How many standard errors above zero is that? Round to 1 decimal.", a:z, tol:0.06, unit:"", steps:"Standard error ≈ 1 ÷ √"+loc(n)+" = "+fmt(se,2)+"%. Then "+roi+" ÷ "+fmt(se,2)+" = "+fmt(z,2)+". Below about 2 could easily be luck."}; }},
 {id:"kelly", name:"Kelly stake",
  lesson:{idea:"Kelly gives the fraction of your bank to stake for the fastest long-run growth. Kelly = (b × p − q) ÷ b, where b is odds − 1, p is your win chance and q = 1 − p.",
   example:"Odds 3.00, p = 40%: b = 2, so (2 × 0.4 − 0.6) ÷ 2 = 0.2 ÷ 2 = 10% of your bank. Quarter Kelly on a €400 bank is 2.5%, which is €10.",
   trick:"If Kelly comes out zero or negative, there's no edge, so don't bet. Your probability estimates are noisy, so stake a quarter or half of full Kelly."},
  gen(){ const o=pick([1.8,2,2.2,2.5,3,4]); const b=o-1; const p=Math.min(0.85,Math.round((1/o+pick([0.03,0.05,0.08,0.1]))*100)/100); const q=1-p; const f=(b*p-q)/b;
   if(rnd(0,1)===0) return {q:"Odds "+od(o)+", your win chance "+fmt(p*100)+"%. What is the full Kelly stake as a percent of your bank? Round to 1 decimal.", a:f*100, tol:0.06, unit:"%", steps:"b = "+fmt(b,2)+", p = "+fmt(p,2)+", q = "+fmt(q,2)+". Kelly = ("+fmt(b,2)+" × "+fmt(p,2)+" − "+fmt(q,2)+") ÷ "+fmt(b,2)+" = ("+fmt(b*p,3)+" − "+fmt(q,2)+") ÷ "+fmt(b,2)+" = "+fmt(f,4)+", so "+fmt(f*100,1)+"%."};

 {id:"compound", name:"Compounding and the rule of 72",
  lesson:{idea:"Compounding means each period's growth is added to the base, so the growth itself grows. Final value = start × (1 + rate) to the power of the number of years.",
   example:"€1,000 at 10% for 3 years: 1,000 × 1.1 × 1.1 × 1.1 = €1,331. Simple interest would give only €1,300.",
   trick:"Rule of 72: years to double ≈ 72 ÷ the yearly percent. At 8% that's 9 years; at 24%, just 3."},

   const P=pick([1000,2000,5000,10000]); const r=pick([5,8,10,20]); const n=pick([2,3]); const v=P*Math.pow(1+r/100,n);
   return {q:"€"+loc(P)+" grows "+r+"% a year for "+n+" years. What is it worth at the end? Round to the nearest euro.", a:v, tol:0.51, unit:"€", steps:"Multiply by "+fmt(1+r/100,2)+" each year: "+loc(P)+" × "+fmt(1+r/100,2)+"^"+n+" = "+loc(P)+" × "+fmt(Math.pow(1+r/100,n),4)+" = €"+fmt(v,2)+"."}; }}
];
function numCandidates(s){
  s=String(s||"").trim().replace(/[−–]/g,"-").replace(/[\s€%]/g,"");
  const out=[], ok=x=>/^-?\d*\.?\d+$/.test(x);
  const a=s.replace(/,/g,"."); if(ok(a)) out.push(parseFloat(a));
  const b=s.replace(/,/g,""); if(ok(b)) out.push(parseFloat(b));
  const c=s.replace(/\./g,"").replace(/,/g,"."); if(ok(c)) out.push(parseFloat(c));
  return out.filter(x=>isFinite(x));
}
function fmtAns(p){ if(p.unit==="%") return fmt(p.a,2)+"%"; if(p.unit==="€") return "€"+fmt(p.a,2); if(p.unit==="years") return fmt(p.a,1)+" years"; return fmt(p.a,3); }

const MATH_BY_ID=Object.fromEntries(MATH.map(m=>[m.id,m]));
let gymListOpen=false;
function mathStat(id){ return ((state.math&&state.math.skills)||{})[id] || {r:0,t:0,recent:""}; }
function mathAcc(st){ const r=st.recent||""; if(!r.length) return null; return r.split("").filter(x=>x==="1").length/r.length; }
function mathLabel(id){ const st=mathStat(id), a=mathAcc(st); if(a==null) return ["New","new"]; if((st.recent||"").length>=8&&a>=0.8) return ["Solid","ok"]; return [Math.round(a*100)+"%","mid"]; }
function firstOpenSkill(){ const m=MATH.find(m=>mathLabel(m.id)[1]!=="ok"); return (m||MATH[0]).id; }
function recordMath(id, ok){
  const sk=Object.assign({}, (state.math&&state.math.skills)||{});
  const s=Object.assign({r:0,t:0,recent:""}, sk[id]);
  s.t++; if(ok) s.r++; s.last=Date.now(); s.recent=((s.recent||"")+(ok?"1":"0")).slice(-10);
  sk[id]=s; state.math={skills:sk}; writeDoc("meta/math", state.math);
}
function showDrillView(){ $("#home").hidden=true; $("#drill").hidden=false; window.scrollTo(0,0); }
function openGym(id){ if(!MATH_BY_ID[id]) return; hush(); drill=null; reader=null; gym={view:"skill", skill:id}; showDrillView(); renderGym(); }
function startGym(id){
  const probs=[], upto=MATH.findIndex(m=>m.id===firstOpenSkill());
  const pool=MATH.filter((m,i)=>i<=Math.max(1,upto)||mathStat(m.id).t>0);
  for(let i=0;i<10;i++){ const m=id==="mixed"?pick(pool):MATH_BY_ID[id]; probs.push(Object.assign({skill:m.id}, m.gen())); }
  hush(); drill=null; reader=null;
  gym={view:"practice", skill:id, probs, i:0, results:[], input:"", checked:false, ok:false, revealed:false, err:null};
  showDrillView(); renderGym();
}
function closeGym(){ hush(); gym=null; $("#drill").hidden=true; $("#home").hidden=false; renderHome(); window.scrollTo(0,0); }
function checkMath(){
  const g=gym, p=g.probs[g.i], c=numCandidates(g.input);
  if(!c.length){ g.err="Type a number first."; renderGym(); return; }
  g.err=null; g.ok=c.some(x=>Math.abs(x-p.a)<=p.tol); g.checked=true;
  recordMath(p.skill,g.ok); g.results.push({skill:p.skill, ok:g.ok}); renderGym();
}
function revealMath(){ const g=gym, p=g.probs[g.i]; g.checked=true; g.ok=false; g.revealed=true; g.err=null; recordMath(p.skill,false); g.results.push({skill:p.skill, ok:false}); renderGym(); }
function nextMath(){
  const g=gym;
  if(g.i+1>=g.probs.length){ g.view="done"; renderGym(); window.scrollTo(0,0); return; }
  g.i++; Object.assign(g,{input:"",checked:false,ok:false,revealed:false,err:null}); renderGym(); window.scrollTo(0,0);
}

  );

  const root=$("#drill"); root.replaceChildren(); const g=gym; if(!g) return;
  if(g.view==="skill"){
    const m=MATH_BY_ID[g.skill], st=mathStat(m.id), lab=mathLabel(m.id)[0], idx=MATH.indexOf(m), nxt=MATH[idx+1];

async function genQuestions(tid){
  if(!gradingAvailable()||(gen[tid]&&gen[tid].busy)) return;
  gen[tid]={busy:true,msg:""}; renderHome();
  const t=TOPIC_BY_ID[tid];
  const cs=allCards().filter(c=>c.t===tid);
  const existing=cs.map(c=>"- "+c.q).join("\n");
  const weak=cs.filter(c=>state.progress[c.id]&&state.progress[c.id].lastScore<=2).flatMap(c=>strArr(state.progress[c.id].missed)).slice(0,12);
  let msg="";
  try{
    const res=await sample.json(genPrompt(t,existing,weak),{cache:false});
    const arr=Array.isArray(res)?res:(res&&Array.isArray(res.questions)?res.questions:[]);
    let n=0;
    for(const q of arr.slice(0,3)){
      const lv=LEVEL_NAME[q&&q.level]?q.level:"apply";
      const prompt=String((q&&q.prompt)||"").trim(); const kp=strArr(q&&q.keyPoints);
      if(!prompt||!kp.length) continue;
      const id="x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      const doc={t:tid, lv, q:prompt.slice(0,600), k:kp, created:Date.now()};
      state.extra[id]=doc; await writeDoc("extra/"+id, doc); n++;
    }
    msg=n?("Added "+n+" new questions. They'll come up in your next drills."):"No usable questions came back. Try again.";
  }catch(e){ msg=sampleErrMsg(e)||"Stopped."; }
  gen[tid]={busy:false,msg};
  if(!drill) renderHome();
}

  bumpStreak();
  autoHabit("drills");
  const d=INTERVALS[np.box];
  drill.dueText="This question comes back "+gapText(d)+".";
  drill.results.push({q:card.q, score, gap:gapText(d)});
}

async function submitAnswer(){
  const d=drill, card=d.cards[d.i], ans=(d.answer||"").trim();
  if(ans.length<3){ d.error="Say or type an answer first, or tap “I don't know”."; renderDrill(); return; }
  if(!gradingAvailable()){ d.phase="selfgrade"; d.error=null; renderDrill(); return; }
  d.phase="grading"; d.error=null; d.ctl=new AbortController(); renderDrill();
  try{
    const g=await callGrade(gradePrompt(card,ans), d.ctl.signal);
    if(drill!==d) return;
    d.grade1=g;
    if(card.lv==="teach" && g.followup && g.score>=2){ d.phase="follow"; }
    else { finishCard(g.score,g,ans); d.phase="graded"; }
  }catch(e){
    if(drill!==d) return;
    const msg=sampleErrMsg(e);
    d.phase=gradingOff?"selfgrade":"ask"; d.error=msg||null;
  }
  renderDrill();
}
async function submitFollow(){
  const d=drill, card=d.cards[d.i], ans2=(d.followAnswer||"").trim();
  if(ans2.length<3){ d.error="Answer the follow-up first, or skip it."; renderDrill(); return; }
  d.phase="grading2"; d.error=null; d.ctl=new AbortController(); renderDrill();
  try{
    const g=await callGrade(followPrompt(card,d.answer.trim(),d.grade1,ans2), d.ctl.signal);
    if(drill!==d) return;
    d.grade2=g; finishCard(g.score,g,d.answer.trim()+"\n\nFollow-up: "+ans2); d.phase="graded";
  }catch(e){
    if(drill!==d) return;
    const msg=sampleErrMsg(e);
    if(gradingOff){ const s=Math.min(d.grade1.score,3); d.capped=true; finishCard(s,d.grade1,d.answer); d.phase="graded"; }
    else { d.phase="follow"; d.error=msg||null; }
  }
  renderDrill();
}
function skipFollow(){
  const d=drill; const s=Math.min(d.grade1.score,3);
  d.capped=true; finishCard(s,d.grade1,d.answer); d.phase="graded"; renderDrill();
}
function dontKnow(){
  const d=drill, card=d.cards[d.i];
  d.grade1={score:0, verdict:"No answer this time. Here's what a strong answer covers.", got:[], missed:card.k.slice(), model:"", followup:""};
  d.lesson=lessonFor(card)?"shown":"hidden";
  finishCard(0,d.grade1,""); d.phase="graded"; renderDrill();
}
async function learnFirst(){
  const d=drill; if(!d) return; const card=d.cards[d.i];
  if(d.phase==="ask") d.studied=true;
  d.lessonErr=null; d.error=null;
  if(lessonFor(card)||!gradingAvailable()){ d.lesson="shown"; renderDrill(); return; }
  d.lesson="loading"; d.ctl=new AbortController(); renderDrill();
  try{
    const L=normLesson(await sample.json(lessonPrompt(card),{signal:d.ctl.signal}));
    if(drill!==d) return;
    if(L){ state.lessons[card.id]=L; writeDoc("lessons/"+card.id, Object.assign({created:Date.now()},L)); }
    else d.lessonErr="The lesson came back empty.";
  }catch(e){
    if(drill!==d) return;
    sampleErrMsg(e);
    d.lessonErr = (e&&e.code==="cancelled") ? "Lesson stopped." : "Couldn't write the lesson right now.";
  }
  d.lesson="shown"; renderDrill();
}
function lessonBody(L){
  return [
    el("div",{class:"lpart"},el("h4",null,"The idea"),el("p",null,L.idea)),
    L.example?el("div",{class:"lpart"},el("h4",null,"Example"),el("p",null,L.example)):null,
    L.trap?el("div",{class:"lpart"},el("h4",null,"Watch out"),el("p",null,L.trap)):null,
    L.remember?el("p",{class:"remember"},L.remember):null
  ];
}
function lessonPanel(card, L, hide, err){
  return el("section",{class:"panel lesson","aria-label":"Lesson"},
    err?el("p",{class:"err"},err):null,
    el("h3",null,"One-minute lesson"),
    lessonBody(L),
    el("div",{class:"row"},
      canPlay("l-"+card.id)?el("button",{class:"ghost small",onclick:()=>play("l-"+card.id, lessonText(L))},"Read aloud"):null,
      hide?el("button",{class:"primary small",onclick:hide},"Hide it and answer from memory"):null
    )
  );
}
function lessonArea(card, withHide){
  const d=drill, L=lessonFor(card);
  const hide = withHide ? ()=>{ hush(); d.lesson="hidden"; renderDrill(); const ta=$("#answer"); if(ta){ try{ ta.focus(); }catch(e){} } } : null;
  if(L) return lessonPanel(card, L, hide, d.lessonErr);
  return el("section",{class:"panel lesson"},
    d.lessonErr?el("p",{class:"err"},d.lessonErr):null,
    el("h3",null,"Key ideas"),
    el("ul",null,card.k.map(k=>el("li",null,k))),
    hide?el("div",{class:"row"},el("button",{class:"primary small",onclick:hide},"Hide them and answer from memory")):null
  );
}
function openReader(tid){
  if(!TOPIC_BY_ID[tid]) return;
  hush(); drill=null; gym=null; reader=tid;
  $("#home").hidden=true; $("#drill").hidden=false;
  renderReader(); window.scrollTo(0,0);
}
function closeReader(){
  hush(); reader=null;
  $("#drill").hidden=true; $("#home").hidden=false;
  renderHome(); window.scrollTo(0,0);
}
function renderReader(){
  const root=$("#drill"); root.replaceChildren();
  const tid=reader, t=TOPIC_BY_ID[tid]; if(!t) return;
  root.append(el("div",{class:"drillbar"},el("button",{class:"linkbtn",onclick:closeReader},"Back")));
  root.append(el("header",{class:"top"},
    el("p",{class:"eyebrow"},"Lessons"),
    el("h2",null,t.name),
    el("p",{class:"lede"},"Read these once, then drill the topic. Answering from memory does far more than rereading.")
  ));
  allCards().filter(c=>c.t===tid).forEach(c=>{
    const L=lessonFor(c);
    root.append(el("article",{class:"panel lesson"},
      el("div",{class:"chips"},el("span",{class:"chip lv-"+c.lv},LEVEL_NAME[c.lv])),
      el("h3",{class:"lq"},c.q),
      L?lessonBody(L):[el("h4",null,"Key ideas"),el("ul",null,c.k.map(k=>el("li",null,k)))],
      (L&&canPlay("l-"+c.id))?el("div",{class:"row"},el("button",{class:"ghost small",onclick:()=>play("l-"+c.id, lessonText(L))},"Read aloud")):null
    ));
  });
  root.append(el("div",{class:"row"},el("button",{class:"primary big",onclick:()=>startDrill(tid)},"Drill this topic now")));
}
function selfScore(n){
  const d=drill, card=d.cards[d.i];
  d.grade1={score:n, verdict:"You scored this yourself.", got:[], missed:[], model:"", followup:""};
  finishCard(n,d.grade1,d.answer); d.phase="graded"; renderDrill();
}
function stopGrading(){ if(drill&&drill.ctl) try{ drill.ctl.abort(); }catch(e){} }

function resultPanel(g, final){
  return el("section",{class:"panel result s"+g.score,"aria-live":"polite"},
    el("div",{class:"scoreline"},el("span",{class:"score"},String(g.score)),el("span",{class:"outof"},"/5"),el("span",{class:"scorelabel"},SCORE_LABEL[g.score])),
    g.verdict?el("p",{class:"verdict"},g.verdict):null,
    g.got.length?el("div",{class:"list good"},el("h3",null,"You got"),el("ul",null,g.got.map(x=>el("li",null,x)))):null,
    g.missed.length?el("div",{class:"list miss"},el("h3",null,g.score===0&&!g.got.length?"Key points":"You missed"),el("ul",null,g.missed.map(x=>el("li",null,x)))):null,
    g.model?el("div",{class:"model"},el("h3",null,final?"Model answer":"What a strong answer says"),el("p",null,g.model)):null,
    (canSpeak&&(g.verdict||g.model))?el("div",{class:"row"},el("button",{class:"ghost small",onclick:()=>speak([g.verdict,g.model].filter(Boolean).join(" "))},"Read feedback aloud")):null,
    (final&&drill.capped)?el("p",{class:"due"},"Follow-up skipped, so the score is capped at 3. Teach-level means handling the follow-up."):null,
    (final&&drill.dueText)?el("p",{class:"due"},drill.dueText):null
  );
}
function thinking(label){
  return el("section",{class:"panel"},
    el("div",{class:"thinking"},el("span",{class:"dot","aria-hidden":"true"}),el("span",null,label)),
    el("div",{class:"row"},el("button",{class:"ghost small",onclick:stopGrading},"Stop"))
  );
}

function renderDrill(){
  const root=$("#drill"); root.replaceChildren();
  const d=drill; if(!d) return;
  if(d.phase==="done") return renderSummary(root);
  const card=d.cards[d.i], topic=TOPIC_BY_ID[card.t], isNew=!state.progress[card.id];

  root.append(el("div",{class:"drillbar"},
    el("button",{class:"linkbtn",onclick:exitDrill},"Exit"),
    el("div",{class:"pips","aria-hidden":"true"},d.cards.map((c,j)=>el("span",{class:"pip"+(j<d.i?" done":"")+(j===d.i?" now":"")}))),
    el("span",{class:"count","aria-label":"Question "+(d.i+1)+" of "+d.cards.length},(d.i+1)+"/"+d.cards.length)
  ));

  root.append(el("section",{class:"panel"},
    el("div",{class:"chips"},el("span",{class:"chip"},topic.name),el("span",{class:"chip lv-"+card.lv},LEVEL_NAME[card.lv]),card.gen?el("span",{class:"chip"},"Written for you"):null),
    el("h2",{class:"question"},card.q),
    el("p",{class:"hint"},LEVEL_HINT[card.lv]),
    el("div",{class:"row"},
      canPlay("q-"+card.id)?el("button",{class:"ghost small",onclick:()=>play("q-"+card.id, card.q)},"Read aloud"):null,
      (d.phase==="ask"&&d.lesson==="hidden")?el("button",{class:(isNew&&!d.studied?"primary":"ghost")+" small",onclick:learnFirst},d.studied?"Show the lesson again":"Learn it first"):null
    ),
    (d.phase==="ask"&&d.lesson==="hidden"&&isNew&&!d.studied)?el("p",{class:"newnote"},"New idea. Try it cold, or read the one-minute lesson first. A wrong guess before reading still helps the lesson stick."):null
  ));

  if(d.phase==="ask"){
    if(d.lesson==="loading"){ root.append(thinking("Claude is writing your lesson…")); return; }
    if(d.lesson==="shown") root.append(lessonArea(card,true));
    const ta=el("textarea",{id:"answer",rows:"7",placeholder:"Tap here, then the mic on your keyboard, and talk it through.","aria-label":"Your answer"});
    ta.value=d.answer||""; ta.addEventListener("input",()=>{ d.answer=ta.value; });
    root.append(el("section",{class:"panel"},ta,
      d.error?el("p",{class:"err",role:"alert"},d.error):null,
      el("div",{class:"row"},
        el("button",{class:"primary",onclick:submitAnswer},gradingAvailable()?"Grade my answer":"Check my answer"),
        el("button",{class:"ghost",onclick:dontKnow},"I don't know")
      )
    ));
    return;
  }
  if(d.answer&&d.answer.trim()) root.append(el("p",{class:"quote"},d.answer.trim()));

  if(d.phase==="grading"){ root.append(thinking("Claude is grading your answer…")); return; }
  if(d.phase==="selfgrade"){
    root.append(el("section",{class:"panel"},
      d.error?el("p",{class:"err",role:"alert"},d.error):null,
      el("h3",null,"A strong answer covers"),
      el("ul",null,card.k.map(k=>el("li",null,k))),
      el("h3",null,"How did you do?"),
      el("div",{class:"selfgrade"},[0,1,2,3,4,5].map(n=>el("button",{onclick:()=>selfScore(n),"aria-label":n+" out of 5, "+SCORE_LABEL[n]},String(n)))),
      el("p",{class:"tip"},"0 missed · 3 most points · 5 could teach it with your own example"),
      (!IN_CLAUDE&&navigator.onLine)?el("div",{class:"row"},el("a",{class:"btnlink",href:"https://claude.ai/new?q="+encodeURIComponent(humanGradePrompt(card,d.answer)),target:"_blank",rel:"noopener"},"Ask Claude for feedback")):null
    ));
    return;
  }
  if(d.phase==="follow"||d.phase==="grading2"){
    root.append(resultPanel(d.grade1,false));
    const fq=el("section",{class:"followq"},
      el("h3",null,"Your student asks"),
      el("p",null,d.grade1.followup),
      canSpeak?el("div",{class:"row"},el("button",{class:"ghost small",onclick:()=>speak(d.grade1.followup)},"Read aloud")):null
    );
    root.append(fq);
    if(d.phase==="grading2"){ if(d.followAnswer) root.append(el("p",{class:"quote"},d.followAnswer.trim())); root.append(thinking("Claude is grading your teach-back…")); return; }
    const ta=el("textarea",{id:"followup",rows:"5",placeholder:"Answer your student. Tap the mic and talk.","aria-label":"Your answer to the follow-up"});
    ta.value=d.followAnswer||""; ta.addEventListener("input",()=>{ d.followAnswer=ta.value; });
    root.append(el("section",{class:"panel"},ta,
      d.error?el("p",{class:"err",role:"alert"},d.error):null,
      el("div",{class:"row"},
        el("button",{class:"primary",onclick:submitFollow},"Answer the follow-up"),
        el("button",{class:"ghost",onclick:skipFollow},"Skip")
      )
    ));
    return;
  }
  if(d.phase==="graded"){
    if(d.grade2){
      root.append(el("p",{class:"tip"},"First explanation scored "+d.grade1.score+"/5. Final score after the follow-up:"));
      root.append(resultPanel(d.grade2,true));
    } else root.append(resultPanel(d.grade1,true));
    const L=lessonFor(card);
    if(d.lesson==="shown"&&L) root.append(lessonPanel(card,L,null,null));
    else if(d.lesson==="loading") root.append(thinking("Claude is writing your lesson…"));
    else if(d.lessonErr) root.append(el("p",{class:"err"},d.lessonErr));
    const last=d.i+1>=d.cards.length;
    root.append(el("div",{class:"row"},
      el("button",{class:"primary big",onclick:nextCard},last?"See results":"Next question"),
      (d.lesson==="hidden"&&(L||gradingAvailable()))?el("button",{class:"ghost",onclick:learnFirst},"Read the lesson"):null
    ));
  }
}

function renderSummary(root){
  const rs=drill.results;
  const avg=rs.length?rs.reduce((a,r)=>a+r.score,0)/rs.length:0;
  root.append(
    el("header",{class:"top"},el("p",{class:"eyebrow"},"Session done"),el("h2",{class:"biggest"},avg.toFixed(1),el("span",null,"average out of 5"))),
    el("section",{class:"panel"},
      el("ul",{class:"sumlist"},rs.map(r=>el("li",null,el("span",{class:"sc s"+r.score},String(r.score)),el("span",null,r.q),el("span",{class:"muted"},"back "+r.gap)))),
    ),
    el("div",{class:"row"},
      el("button",{class:"primary",onclick:()=>startDrill(drill.topic)},"Five more"),
      el("button",{class:"ghost",onclick:exitDrill},"Back to overview")
    )
  );
}

/* ---------- boot ---------- */
function onData(){ lsSave(); if(!drill) renderHome(); }
async function init(){
  lsLoad(); if(!state.game) state.game=normGame(null); renderHome();
  if(!IN_CLAUDE) registerSW();
  if(canSpeak){ loadVoices(); try{ speechSynthesis.addEventListener("voiceschanged", loadVoices); }catch(e){} }
  const C=window.claude;
  if(!C||typeof C.use!=="function"){ state.store="local"; sampleChecked=true; renderHome(); return; }
  C.use("sample").then(s=>{ sample=s||null; sampleChecked=true; if(!drill) renderHome(); }).catch(()=>{ sampleChecked=true; if(!drill) renderHome(); });
  let d=null; try{ d=await C.use("db"); }catch(e){ d=null; }
  if(!d){ state.store="local"; if(!drill) renderHome(); return; }
  db=d; state.store="connecting"; if(!drill) renderHome();
  const timer=setTimeout(()=>{ if(state.store==="connecting"){ state.store="slow"; if(!drill) renderHome(); } },10000);
  db.collection("cards").onSnapshot(snap=>{
    const p={}; snap.docs.forEach(doc=>{ const v=doc.data(); if(v) p[doc.id]=Object.assign({},v); });
    if(snap.metadata.fromCache && snap.empty && Object.keys(state.progress).length){ return; }
    state.progress=p;
    if(!snap.metadata.fromCache){ clearTimeout(timer); if(state.store==="connecting"||state.store==="slow") state.store="synced"; }
    onData();
  }, ()=>{ clearTimeout(timer); state.store="readfail"; if(!drill) renderHome(); });
  db.collection("extra").onSnapshot(snap=>{
    const x={}; snap.docs.forEach(doc=>{ const v=doc.data(); if(v) x[doc.id]=Object.assign({},v); });
    if(snap.metadata.fromCache && snap.empty && Object.keys(state.extra).length) return;
    state.extra=x; onData();
  }, ()=>{});
  db.collection("lessons").onSnapshot(snap=>{
    const x={}; snap.docs.forEach(doc=>{ const v=normLesson(doc.data()); if(v) x[doc.id]=v; });
    if(snap.metadata.fromCache && snap.empty && Object.keys(state.lessons).length) return;
    state.lessons=x; lsSave();
  }, ()=>{});
  db.doc("game/state").onSnapshot(s=>{
    if(s.exists){ state.game=normGame(s.data()); lsSave(); if(!drill&&!reader&&!gym&&!gameView) renderHome(); }
  }, ()=>{});
  db.doc("meta/math").onSnapshot(s=>{
    if(s.exists){ const v=s.data(); if(v&&v.skills){ state.math={skills:Object.assign({}, v.skills)}; onData(); } }
  }, ()=>{});
  db.doc("meta/state").onSnapshot(s=>{
    if(s.exists){ state.meta=Object.assign({streak:0,lastDay:null,answered:0,total:0}, s.data()); onData(); }
  }, ()=>{});
}
init();
})();
</script>
